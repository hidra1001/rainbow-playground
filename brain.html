<title>무지개 두뇌 놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --ground: #FFE4F0;
    --ground-2: #FFF3F8;
    --card: #FFFFFF;
    --pink: #FF5FA2;
    --pink-deep: #E8408A;
    --plum: #5B2A4E;
    --plum-soft: #9A6A8C;
    --r1: #FF6B6B; --r2: #FFB347; --r3: #FFE66D; --r4: #7ED957; --r5: #5DADE2; --r6: #B57EDC;
    --good: #5FC97A;
    --oops: #FF8A80;
    --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--ground);
    background-image:
      radial-gradient(circle at 15% 20%, #FFD1E6 0 60px, transparent 61px),
      radial-gradient(circle at 85% 30%, #FFD9EA 0 80px, transparent 81px),
      radial-gradient(circle at 70% 85%, #FFCCE2 0 50px, transparent 51px),
      radial-gradient(circle at 20% 80%, #FFDDEC 0 70px, transparent 71px);
    color: var(--plum);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 20px 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .arch { position: relative; height: 120px; overflow: hidden; margin-bottom: -20px; }
  .arch svg { width: 100%; height: 100%; display: block; }
  .cloud { position: absolute; bottom: 4px; width: 88px; height: 34px; background: #fff; border-radius: 40px; box-shadow: 0 6px 0 #FFD1E6; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 42px; height: 42px; left: 10px; top: -20px; }
  .cloud::after { width: 32px; height: 32px; right: 12px; top: -12px; }
  .cloud.l { left: 2%; } .cloud.r { right: 2%; }
  .letters { position: absolute; inset: 0; pointer-events: none; font-size: 26px; }
  .letters span { position: absolute; }

  h1 {
    font-family: var(--display);
    font-size: clamp(34px, 9vw, 46px);
    text-align: center; margin: 0; line-height: 1.1; text-wrap: balance;
    background: linear-gradient(90deg, var(--r1), var(--r2), #F2C94C, var(--r4), var(--r5), var(--r6));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #fff);
  }
  .sub { text-align: center; margin: 0; font-size: 17px; color: var(--plum-soft); }

  .card {
    background: var(--card); border-radius: 32px; padding: 24px 22px 26px;
    box-shadow: 0 10px 0 #FFC2DB, 0 16px 30px rgba(232, 64, 138, .15);
    border: 4px solid #FFD6E7;
  }
  [hidden] { display: none !important; }

  .btn {
    font-family: var(--display); font-size: 26px; border: 0; border-radius: 24px;
    padding: 16px 20px; cursor: pointer; color: #fff; background: var(--pink);
    box-shadow: 0 7px 0 var(--pink-deep);
    transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; line-height: 1.1;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--pink-deep); }
  .btn:focus-visible { outline: 4px solid var(--r5); outline-offset: 3px; }

  /* 난이도 */
  .level { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 16px; }
  .level button {
    font-family: var(--display); font-size: 20px; padding: 10px 16px; border-radius: 30px; cursor: pointer;
    border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft);
  }
  .level button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 4px 0 var(--pink-deep); }
  .level button:focus-visible { outline: 4px solid var(--r5); outline-offset: 2px; }
  .level-note { text-align: center; font-size: 14px; color: var(--plum-soft); margin: -6px 0 10px; }
  .diffrow { display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: wrap; margin: -2px 0 12px; font-size: 14px; color: var(--plum-soft); }
  .diffrow span { margin-right: 4px; }
  .diffrow button { font-family: var(--display); font-size: 15px; min-width: 40px; height: 38px; padding: 0 8px; border-radius: 20px; border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft); cursor: pointer; }
  .diffrow button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 3px 0 var(--pink-deep); }
  .ps { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 0 6px; }
  .ps-ico { font-size: 64px; line-height: 1; }
  .ps-title { font-family: var(--display); font-size: 32px; margin: 0; font-weight: normal; }
  .ps-desc { margin: 0; color: var(--plum-soft); font-size: 17px; }
  .ps-level { margin: 0; font-family: var(--display); color: var(--pink-deep); font-size: 18px; }
  .ps-note { font-size: 13px; color: var(--plum-soft); margin: 0; }
  .ps-start { font-size: 30px; padding: 16px 52px; margin-top: 6px; }

  .modes { display: grid; gap: 14px; }
  .mode { display: flex; align-items: center; gap: 16px; text-align: left; padding: 14px 20px; }
  .mode .ico { font-size: 38px; line-height: 1; }
  .mode small { display: block; font-family: var(--body); font-size: 15px; opacity: .9; margin-top: 4px; }
  .mode.memory { background: var(--r1); box-shadow: 0 7px 0 #D94E4E; }
  .mode.memory:active { box-shadow: 0 2px 0 #D94E4E; }
  .mode.pattern { background: var(--r2); box-shadow: 0 7px 0 #D9902E; }
  .mode.pattern:active { box-shadow: 0 2px 0 #D9902E; }
  .mode.simon { background: var(--r6); box-shadow: 0 7px 0 #9560C0; }
  .mode.simon:active { box-shadow: 0 2px 0 #9560C0; }
  .mode.odd { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .mode.odd:active { box-shadow: 0 2px 0 #3F8FC2; }
  .mode.tap { background: #F2C94C; box-shadow: 0 7px 0 #C9A227; } .mode.tap:active { box-shadow: 0 2px 0 #C9A227; }
  @media (min-width: 600px) { .modes { grid-template-columns: 1fr 1fr; } }
  .tgrid { display: grid; gap: 8px; }
  .tcell { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--r3); font-family: var(--display); font-size: 26px; color: var(--plum); cursor: pointer; box-shadow: 0 5px 0 #E8CF4A; }
  .tcell:active { transform: translateY(3px); box-shadow: 0 2px 0 #E8CF4A; }
  .tcell.done { background: var(--good); color: #fff; box-shadow: none; opacity: .55; }
  .tcell.no { animation: tshake .4s; background: var(--oops); }
  @keyframes tshake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  .best { text-align: center; font-size: 15px; color: var(--plum-soft); margin: 14px 0 0; line-height: 1.6; }

  .stars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .stars span { font-size: 24px; filter: grayscale(1) opacity(.35); transition: transform .3s, filter .3s; }
  .stars span.on { filter: none; transform: scale(1.15); }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; color: var(--plum-soft); }
  .topbar button { background: none; border: 0; font-family: var(--body); font-size: 15px; color: var(--plum-soft); cursor: pointer; text-decoration: underline; padding: 6px; }
  .topbar button:focus-visible { outline: 3px solid var(--r5); border-radius: 8px; }
  .tag { background: var(--ground-2); border: 2px solid #FFD6E7; border-radius: 20px; padding: 3px 10px; font-family: var(--display); }
  .ask { text-align: center; font-size: 17px; color: var(--plum-soft); margin: 4px 0 12px; min-height: 22px; }
  .info { text-align: center; font-family: var(--display); font-size: 20px; color: var(--plum); margin: 0 0 12px; }
  .feedback { min-height: 34px; text-align: center; font-family: var(--display); font-size: 26px; margin-top: 16px; color: var(--pink-deep); }
  .feedback.good { color: #3FA85D; }

  /* 짝 맞추기 */
  .mgrid { display: grid; gap: 10px; }
  .mcard { aspect-ratio: 3 / 4; perspective: 700px; background: none; border: 0; padding: 0; cursor: pointer; }
  .mcard:focus-visible { outline: 4px solid var(--r5); border-radius: 16px; }
  .mcard .in { position: relative; display: block; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
  .mcard.open .in, .mcard.done .in { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; display: grid; place-items: center; font-size: clamp(28px, 9vw, 44px); }
  .face.front { background: linear-gradient(135deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6)); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); }
  .face.back { background: #fff; border: 3px solid #FFD6E7; transform: rotateY(180deg); }
  .mcard.done .face.back { background: #EAF9EE; border-color: #4DB369; }
  .mcard.done { animation: pop .4s; }

  /* 규칙 찾기 */
  .prow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-bottom: 18px; }
  .pitem {
    width: 54px; height: 54px; display: grid; place-items: center; font-size: 34px; line-height: 1;
    border-radius: 14px; background: var(--ground-2); border: 3px solid #FFD6E7;
  }
  .pitem.q { border: 3px dashed var(--pink); color: var(--pink); font-family: var(--display); font-size: 32px; }
  .pitem.num { font-family: var(--display); font-size: 24px; }
  .pitem.dots, .choice .dots { display: flex; flex-wrap: wrap; gap: 3px; padding: 7px; align-content: center; justify-content: center; }
  .pitem.dots i, .choice .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--pink); }
  .choice .dots { width: 54px; height: 54px; margin: 0 auto; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choices.four { grid-template-columns: repeat(2, 1fr); }
  .choice { font-size: 36px; padding: 12px 4px; line-height: 1; }
  .choice.pc { background: #fff !important; color: var(--plum); border: 4px solid #FFD6E7; box-shadow: 0 7px 0 #FFC2DB !important; }
  .choice.pc.num { font-size: 30px; }
  .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2) !important; }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--good) !important; color: #fff; border-color: #4DB369; box-shadow: 0 7px 0 #4DB369 !important; }
  .choice.wrong { background: #E9C8D6 !important; color: #fff; border-color: #C9A6B8; box-shadow: 0 7px 0 #C9A6B8 !important; }

  /* 순서 기억 */
  .pads { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 0 auto; max-width: 340px; }
  .pads.six { grid-template-columns: repeat(3, 1fr); max-width: 400px; }
  .pad { aspect-ratio: 1; border: 0; border-radius: 28px; cursor: pointer; opacity: .5; transition: opacity .12s, transform .12s; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
  .pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 5px #fff, 0 0 26px rgba(0,0,0,.2); }
  .pad:focus-visible { outline: 4px solid var(--plum); }
  .pads.shake { animation: shake .4s; }

  /* 다른 그림 찾기 */
  .ogrid { display: grid; gap: 6px; }
  .ocell { aspect-ratio: 1; border: 0; border-radius: 12px; background: var(--ground-2); cursor: pointer; line-height: 1; padding: 0; display: grid; place-items: center; }
  .ocell:focus-visible { outline: 3px solid var(--r5); }
  .ocell.no { animation: shake .4s; background: #FFE0DC; }
  .ocell.yes { background: #DFF5E5; outline: 4px solid var(--good); animation: pop .4s; }
  .ocell.reveal { outline: 4px dashed var(--pink); }
  .timer { height: 12px; background: #FFD6E7; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--r1), var(--r2), var(--r4), var(--r5), var(--r6)); transition: width 10s linear; }

  .result { text-align: center; }
  .result .big { font-size: 80px; line-height: 1; margin: 6px 0 10px; animation: bounce 1s infinite alternate; }
  .result h2 { font-family: var(--display); font-size: 34px; margin: 0 0 6px; color: var(--pink-deep); }
  .result p { margin: 0 0 20px; font-size: 18px; }
  .result .score { font-family: var(--display); font-size: 30px; color: var(--plum); }
  .result .actions { display: grid; gap: 12px; }
  .result .again { background: var(--r4); box-shadow: 0 7px 0 #5FB25A; }
  .result .home { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .result .hub { display: block; text-decoration: none; text-align: center; background: var(--pink); box-shadow: 0 7px 0 var(--pink-deep); }
  .hublink { display: inline-block; font-family: var(--body); font-size: 15px; color: var(--plum-soft); text-decoration: none; border: 2px solid #FFD6E7; border-radius: 30px; padding: 6px 14px; margin-bottom: 10px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @keyframes pop { from { transform: scale(.6); } 70% { transform: scale(1.12); } to { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  @keyframes bounce { from { transform: translateY(0);} to { transform: translateY(-14px);} }
  @media (prefers-reduced-motion: reduce) {
    .result .big, .mcard.done, .ocell.yes { animation: none; }
    .btn, .stars span { transition: none; }
    .mcard .in { transition: transform .15s; }
  }
  @media (max-width: 400px) {
    .card { padding: 20px 14px 22px; }
    .choice { font-size: 32px; }
    .pitem { width: 46px; height: 46px; font-size: 28px; }
  }
</style>

</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="arch" aria-hidden="true">
    <svg viewBox="0 0 520 130" preserveAspectRatio="xMidYMax meet">
      <path d="M20 130 A240 240 0 0 1 500 130" fill="none" stroke="#FF6B6B" stroke-width="16"/>
      <path d="M36 130 A224 224 0 0 1 484 130" fill="none" stroke="#FFB347" stroke-width="16"/>
      <path d="M52 130 A208 208 0 0 1 468 130" fill="none" stroke="#FFE66D" stroke-width="16"/>
      <path d="M68 130 A192 192 0 0 1 452 130" fill="none" stroke="#7ED957" stroke-width="16"/>
      <path d="M84 130 A176 176 0 0 1 436 130" fill="none" stroke="#5DADE2" stroke-width="16"/>
      <path d="M100 130 A160 160 0 0 1 420 130" fill="none" stroke="#B57EDC" stroke-width="16"/>
    </svg>
    <div class="letters">
      <span style="left:26%;top:40%">🧩</span><span style="left:44%;top:14%">💡</span>
      <span style="left:60%;top:20%">🔍</span><span style="left:72%;top:44%">🎵</span>
    </div>
    <div class="cloud l"></div>
    <div class="cloud r"></div>
  </div>

  <h1>무지개 두뇌 놀이</h1>
  <p class="sub">기억하고, 찾고, 규칙을 알아맞혀요 🌈</p>

  <section class="card" id="home">
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <p class="sub">몇 살 놀이로 할까요?</p>
    <div class="level" role="group" aria-label="난이도">
      <button type="button" id="level-easy" data-level="easy" aria-pressed="true">🌸 6살</button>
    </div>
    <p class="level-note" id="level-note"></p>
    <div class="modes">
      <button class="btn mode memory" id="mode-memory" data-mode="memory"><span class="ico" id="ico-memory">🃏</span><span id="label-memory"></span></button>
      <button class="btn mode pattern" id="mode-pattern" data-mode="pattern"><span class="ico" id="ico-pattern">🔮</span><span id="label-pattern"></span></button>
      <button class="btn mode simon" id="mode-simon" data-mode="simon"><span class="ico" id="ico-simon">🎵</span><span id="label-simon"></span></button>
      <button class="btn mode odd" id="mode-odd" data-mode="odd"><span class="ico" id="ico-odd">🔍</span><span id="label-odd"></span></button>
      <button class="btn mode tap" id="mode-tap" data-mode="tap"><span class="ico" id="ico-tap">🔢</span><span id="label-tap"></span></button>
    </div>
    <p class="best" id="best"></p>
  </section>

  <!-- 시작 전: 난이도 고르고 시작 -->
  <section class="card" id="prestart" hidden>
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <div class="ps">
      <div class="ps-ico" id="ps-ico"></div>
      <h2 class="ps-title" id="ps-title"></h2>
      <p class="ps-desc" id="ps-desc"></p>
      <p class="ps-level" id="ps-level"></p>
      <div class="diffrow" id="diffrow"><span>난이도</span><button type="button" data-diff="-3">−3</button><button type="button" data-diff="-2">−2</button><button type="button" data-diff="-1">−1</button><button type="button" data-diff="0">기본</button><button type="button" data-diff="1">+1</button><button type="button" data-diff="2">+2</button><button type="button" data-diff="3">+3</button></div>
      <p class="ps-note">쉬우면 시간이 넉넉하고 보기가 적어요. 어려우면 빨라지고 비슷한 보기가 늘어요. 이 놀이에만 적용돼요.</p>
      <button class="btn ps-start" id="ps-start">시작! ▶</button>
    </div>
  </section>

  <section class="card" id="game" hidden>
    <div class="topbar">
      <span id="round">1 / 10</span>
      <span class="tag" id="tag"></span>
      <button id="quit" type="button">처음으로</button>
    </div>
    <div class="stars" id="stars" aria-label="모은 별"></div>
    <p class="ask" id="ask"></p>
    <div id="area"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <section class="card result" id="result" hidden>
    <div class="big" id="result-emoji">🎉</div>
    <h2 id="result-title">참 잘했어요!</h2>
    <p class="score" id="result-score"></p>
    <p id="result-msg"></p>
    <div class="actions">
      <button class="btn again" id="again">한 번 더! 🌟</button>
      <button class="btn home" id="home-btn">처음으로 🏠</button>
      <a class="btn hub" id="to-hub" href="index.html" hidden>🏠 놀이터로 돌아가기</a>
    </div>
  </section>
</div>

<script>
(function () {
  let TOTAL = 10;
  const $ = id => document.getElementById(id);
  const rnd = n => Math.floor(Math.random() * n);
  const pick = a => a[rnd(a.length)];
  const shuffle = a => a.slice().sort(() => Math.random() - .5);
  const PRAISE = ['참 잘했어요!', '딩동댕!', '와, 대단해!', '정답이에요!', '최고예요!', '멋져요!'];

  const LEVEL_NAME = { five: "5살", easy: '6살', hard: '7살', pro: '8살', nine: '9살' };
  /* 난이도 조정 (-3에서 +3): 놀이터 설정(rp-diff)이나 주소의 diff= 로 정해요 */
  let DIFF = 0;
  { const d = new URLSearchParams(location.search).get("diff"); if (d !== null && d !== "" && Math.abs(+d) <= 3) DIFF = +d; }
  const TS = () => 1 - EFF() * .16;                                    // 시간 배율: 쉬우면 더 길게, 어려우면 더 짧게
  const DIFF_TXT = () => DIFF ? (EFF() > 0 ? " +" + DIFF : " " + DIFF) : "";
  const EFF = () => level === "five" ? Math.max(-3, DIFF - 2) : DIFF;   // 5살은 6살 놀이를 두 단계 더 쉽게
  const GAME_KEY = "brain";
  let pendingMode = null;
  const diffKey = m => "rp-diff:" + GAME_KEY + ":" + m;
  function loadDiffFor(m) { try { const v = localStorage.getItem(diffKey(m)); DIFF = v === null ? 0 : Math.max(-3, Math.min(3, +v || 0)); } catch (e) { DIFF = 0; } }
  function openPrestart(m) {

    later(() => setPad(i, false), 180);
    if (i === s.seq[s.pos]) {
      s.pos++;
      if (s.pos === s.seq.length) {
        s.input = false;
        state.score++; renderStars(); praise();
        state.round++;
        if (state.round >= TOTAL) return later(finish, 1000);
        later(() => { s.seq.push(rnd(s.n)); showSeq(); }, 1000);
      }
    } else {
      s.input = false;
      $('pads').classList.add('shake'); sndBad();
      say('앗, 순서가 달랐어요');
      ask(`${state.score}개까지 기억했어요`);
      later(finish, 1400);
    }
  }

  /* ───────── 4. 다른 그림 찾기 ───────── */
  function nextOdd() {
    const g = { easy: 3, hard: 4, pro: 5, nine: 6 }[state.level];
    let [base, odd] = pick(ODD[state.level]);
    if (rnd(2)) [base, odd] = [odd, base];
    const oddIdx = rnd(g * g);
    state.o = { oddIdx, tried: false, done: false };
    state.tried = false;
    setRound(); ask('다른 그림 하나를 찾아 눌러요'); say('');
    const fs = `calc(min(480px, 100vw - 90px) / ${g} * 0.58)`;
    $("area").innerHTML = (state.level === "nine" || EFF() >= 2 ? `<div class="timer"><i id="tbar"></i></div>` : "") +
      `<div class="ogrid" style="grid-template-columns:repeat(${g},1fr)">${Array.from({length: g * g}, (_, i) =>
        `<button class="ocell" id="oc-${i}" data-i="${i}" style="font-size:${fs}">${i === oddIdx ? odd : base}</button>`).join('')}</div>`;
    state.locked = false;
    if (state.level === "nine" || EFF() >= 2) {
      const bar = $("tbar");
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = '0%'; }));
      state.o.timer = later(() => {
        if (state.o.done) return;
        state.o.done = true; state.locked = true;
        $('oc-' + oddIdx).classList.add('reveal');
        say('시간이 다 됐어요 ⏰'); sndBad();
        advance(nextOdd, 1300);
      }, Math.round(10000 * TS()));
    }
  }
  function tapCell(btn) {
    if (state.locked || state.o.done) return;
    const i = +btn.dataset.i;
    if (i === state.o.oddIdx) {
      state.o.done = true; state.locked = true;
      if (state.o.timer) clearTimeout(state.o.timer);
      btn.classList.add('yes');
      if (!state.o.tried) state.score++;
      renderStars(); praise();
      advance(nextOdd, 1000);
    } else {
      state.o.tried = true;
      btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no');
      say('거기는 아니에요. 다시 찾아봐요 🍀'); sndBad();
    }
  }

  /* ───────── 5. 순서대로 누르기 ───────── */
  function setupTap() {
    const cfg = { easy: { n: 10, step: 1, par: 20 }, hard: { n: 15, step: 1, par: 25 }, pro: { n: 16, step: 2, par: 32 }, nine: { n: 20, step: 3, par: 45 } }[state.level];
    const nums = Array.from({ length: cfg.n }, (_, i) => (i + 1) * cfg.step);
    const order = shuffle(nums);
    state.t = { nums, next: 0, wrong: 0, t0: Date.now(), par: cfg.par * TS() };
    setRound('한 판');
    ask(cfg.step === 1 ? `1부터 ${cfg.n}까지 순서대로 눌러요` : `${cfg.step}씩 뛰어 세며 순서대로 눌러요 (${cfg.step}, ${cfg.step * 2}, ${cfg.step * 3}…)`);
    const cols = cfg.n <= 10 ? 5 : cfg.n <= 16 ? 4 : 5;
    $('area').innerHTML = `<p class="info" id="tinfo">⏱ 0초 · 다음 수: ${nums[0]}</p><div class="tgrid" style="grid-template-columns:repeat(${cols},1fr)">${order.map(v => `<button class="tcell" data-v="${v}">${v}</button>`).join('')}</div>`;
    state.locked = false;
    state.t.tick = setInterval(() => { const el = $('tinfo'); if (el && state.t) el.textContent = `⏱ ${Math.floor((Date.now() - state.t.t0) / 1000)}초 · 다음 수: ${state.t.nums[state.t.next] ?? '끝!'}`; }, 500);
    timers.push(state.t.tick);
  }
  function tapNum(btn) {
    if (state.locked || state.mode !== 'tap' || btn.disabled) return;
    const v = +btn.dataset.v, T = state.t;
    if (v === T.nums[T.next]) {
      btn.classList.add('done'); btn.disabled = true; T.next++; tone(880, 0, .08, 'sine', .1);
      if (T.next >= T.nums.length) {
        clearInterval(T.tick); state.locked = true;
        const secs = (Date.now() - T.t0) / 1000;
        const over = Math.max(0, Math.floor((secs - T.par) / 5));
        state.score = Math.max(1, Math.min(TOTAL, TOTAL - T.wrong - over));
        renderStars();
        say(`${Math.round(secs)}초 만에 다 눌렀어요! 🌟`, true); sndGood(); confetti(60);
        later(finish, 1400);
      }
    } else {
      T.wrong++;
      btn.classList.remove('no'); void btn.offsetWidth; btn.classList.add('no');
      say(`다음은 ${T.nums[T.next]}이에요 🍀`); sndBad();
    }
  }

  /* ───────── 결과 ───────── */
  function finish() {
    clearTimers();
    saveBest();
    const s = state.score, L = state.level, m = state.mode;
    $('result-score').textContent = '⭐ ' + s + ' / ' + TOTAL;
    let extra = '';
    if (m === 'memory') extra = `뒤집은 횟수 ${state.m.moves}번으로 ${state.m.pairs}쌍을 모두 찾았어요.`;
    if (m === 'simon') extra = `순서 ${s}개까지 기억했어요.`;
    if (s === TOTAL) {
      $('result-emoji').textContent = '🦄'; $('result-title').textContent = '완벽해요! 두뇌 박사님!';
      $('result-msg').textContent = extra || (L === 'easy' ? '이제 7살 놀이에 도전해 볼까요?' : L === 'hard' ? '이제 8살 놀이에 도전해 볼까요?' : L === 'pro' ? '이제 9살 놀이에 도전해 볼까요?' : '별 열 개를 모두 모았어요!');
    } else if (s >= 7) { $('result-emoji').textContent = '🌈'; $('result-title').textContent = '정말 잘했어요!'; $('result-msg').textContent = extra || '조금만 더 하면 별을 다 모을 수 있어요.'; }
    else { $('result-emoji').textContent = '🌸'; $('result-title').textContent = '열심히 했어요!'; $('result-msg').textContent = extra || '천천히 다시 해 보면 더 잘할 수 있어요.'; }
    show('result'); sndWin(); confetti(120);
  }

  function show(id) {
    ["home","game","result","prestart"].forEach(x => $(x).hidden = x !== id);
    if (id === "home") loadBest();
    if (id === "result") reportMission();
  }
  function setLevel(l) {
    level = l;
    document.querySelectorAll('.level button').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === l ? 'true' : 'false'));
    $('level-note').textContent = LEVEL_NOTE[l];
    renderDiff();
    for (const m of ["memory","pattern","simon","odd","tap"]) {
      const [ico, title, small] = MODE_LABEL[l][m];
      $('ico-' + m).textContent = ico;
      $('label-' + m).innerHTML = title + '<small>' + small + '</small>';
    }
    try { localStorage.setItem('rainbow-brain-level', l); } catch (e) {}
  }

  /* 이벤트 */
  document.querySelectorAll('.level button').forEach(b => b.addEventListener('click', () => setLevel(b.dataset.level)));
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => openPrestart(b.dataset.mode)));
  $('area').addEventListener('click', e => {
    if (!state) return;
    const t = e.target;
    const card = t.closest('.mcard'); if (card && state.mode === 'memory') return tapCard(card);
    const ch = t.closest('.choice'); if (ch && state.mode === 'pattern') return tapPatternChoice(ch);
    const pad = t.closest('.pad'); if (pad && state.mode === 'simon') return tapPad(pad);
    const cell = t.closest('.ocell'); if (cell && state.mode === 'odd') return tapCell(cell);
    const tc = t.closest(".tcell"); if (tc && state.mode === "tap") return tapNum(tc);
  });
  $('again').addEventListener('click', () => start(state.mode));
  $("home-btn").addEventListener("click", () => { location.href = "index.html"; });
  $("quit").addEventListener("click", () => { location.href = "index.html"; });

  /* 놀이터(index.html) 미션 연동 */
  let missionId = null;
  function reportMission() {
    const missionId = GAME_KEY + ":" + state.level + ":" + state.mode;   // 오늘 한 놀이로 기록
    try {
      const key = "rp-results", all = JSON.parse(localStorage.getItem(key) || "{}");
      const d = new Date(), day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      all[day] = all[day] || {};
      all[day][missionId] = Math.max(all[day][missionId] || 0, Math.round(state.score * 10 / TOTAL));
      localStorage.setItem(key, JSON.stringify(all));
      // 뽑기 에너지용 기록: 놀이를 마칠 때마다 한 줄씩
      const lg = JSON.parse(localStorage.getItem("rp-log") || "[]"); lg.push({ t: Date.now(), id: missionId, score: Math.round(state.score * 10 / TOTAL) }); if (lg.length > 500) lg.splice(0, lg.length - 500); localStorage.setItem("rp-log", JSON.stringify(lg));
    } catch (e) {}
    $("to-hub").hidden = true; $("home-btn").hidden = false;
  }
  function launchFromUrl() {
    const p = new URLSearchParams(location.search);
    const l = p.get("level"), m = p.get("mode");
    if (!m || !LEVEL_NAME[l] || !MODE_LABEL[l] || !MODE_LABEL[l][m]) return false;
    missionId = GAME_KEY + ":" + l + ":" + m;
    const n = +p.get("n"); if (n === 5 || n === 10) TOTAL = n;
    setLevel(l); openPrestart(m); return true;
  }
  function renderDiff() {
    document.querySelectorAll("#diffrow button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.diff === DIFF ? "true" : "false"));
  }
  document.querySelectorAll("#diffrow button").forEach(b => b.addEventListener("click", () => { DIFF = +b.dataset.diff; try { localStorage.setItem(diffKey(pendingMode || (state && state.mode) || "x"), DIFF); } catch (e) {} renderDiff(); }));
  $("ps-start").addEventListener("click", () => { if (pendingMode) start(pendingMode); });
  function boot(data) {
    let saved = 'hard';
    try { saved = localStorage.getItem('rainbow-brain-level') || 'hard'; } catch (e) {}
    if (data && data.level && LEVEL_NAME[data.level]) saved = data.level;
    if (!LEVEL_NAME[saved]) saved = 'hard';
    saved = "easy";   // 지금은 6살 놀이만 보여 줘요 (5·7·8·9살 내용은 숨김)
    setLevel(saved);
    if (launchFromUrl()) return;
    show('home');
  }
  if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ level }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
