<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>무지개 한글 놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --ground: #FFE4F0;
    --ground-2: #FFF3F8;
    --card: #FFFFFF;
    --pink: #FF5FA2;
    --pink-deep: #E8408A;
    --plum: #5B2A4E;
    --plum-soft: #9A6A8C;
    --r1: #FF6B6B; --r2: #FFB347; --r3: #FFE66D; --r4: #7ED957; --r5: #5DADE2; --r6: #B57EDC;
    --good: #5FC97A;
    --oops: #FF8A80;
    --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--ground);
    background-image:
      radial-gradient(circle at 15% 20%, #FFD1E6 0 60px, transparent 61px),
      radial-gradient(circle at 85% 30%, #FFD9EA 0 80px, transparent 81px),
      radial-gradient(circle at 70% 85%, #FFCCE2 0 50px, transparent 51px),
      radial-gradient(circle at 20% 80%, #FFDDEC 0 70px, transparent 71px);
    color: var(--plum);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 20px 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .arch { position: relative; height: 120px; overflow: hidden; margin-bottom: -20px; }
  .arch svg { width: 100%; height: 100%; display: block; }
  .cloud { position: absolute; bottom: 4px; width: 88px; height: 34px; background: #fff; border-radius: 40px; box-shadow: 0 6px 0 #FFD1E6; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 42px; height: 42px; left: 10px; top: -20px; }
  .cloud::after { width: 32px; height: 32px; right: 12px; top: -12px; }
  .cloud.l { left: 2%; } .cloud.r { right: 2%; }
  .letters { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); font-size: 26px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .letters span { position: absolute; }

  h1 {
    font-family: var(--display);
    font-size: clamp(34px, 9vw, 46px);
    text-align: center; margin: 0; line-height: 1.1; text-wrap: balance;
    background: linear-gradient(90deg, var(--r1), var(--r2), #F2C94C, var(--r4), var(--r5), var(--r6));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #fff);
  }
  .sub { text-align: center; margin: 0; font-size: 17px; color: var(--plum-soft); }

  .card {
    background: var(--card); border-radius: 32px; padding: 24px 22px 26px;
    box-shadow: 0 10px 0 #FFC2DB, 0 16px 30px rgba(232, 64, 138, .15);
    border: 4px solid #FFD6E7;
  }
  [hidden] { display: none !important; }

  .btn {
    font-family: var(--display); font-size: 26px; border: 0; border-radius: 24px;
    padding: 16px 20px; cursor: pointer; color: #fff; background: var(--pink);
    box-shadow: 0 7px 0 var(--pink-deep);
    transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; line-height: 1.1;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--pink-deep); }
  .btn:focus-visible { outline: 4px solid var(--r5); outline-offset: 3px; }

  /* 난이도 */
  .level { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 16px; }
  .level button {
    font-family: var(--display); font-size: 20px; padding: 10px 16px; border-radius: 30px; cursor: pointer;
    border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft);
  }
  .level button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 4px 0 var(--pink-deep); }
  .level button:focus-visible { outline: 4px solid var(--r5); outline-offset: 2px; }
  .level-note { text-align: center; font-size: 14px; color: var(--plum-soft); margin: -6px 0 10px; }
  .diffrow { display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: wrap; margin: -2px 0 12px; font-size: 14px; color: var(--plum-soft); }
  .diffrow span { margin-right: 4px; }
  .diffrow button { font-family: var(--display); font-size: 15px; min-width: 40px; height: 38px; padding: 0 8px; border-radius: 20px; border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft); cursor: pointer; }
  .diffrow button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 3px 0 var(--pink-deep); }
  .ps { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 0 6px; }
  .ps-ico { font-size: 64px; line-height: 1; }
  .ps-title { font-family: var(--display); font-size: 32px; margin: 0; font-weight: normal; }
  .ps-desc { margin: 0; color: var(--plum-soft); font-size: 17px; }
  .ps-level { margin: 0; font-family: var(--display); color: var(--pink-deep); font-size: 18px; }
  .ps-note { font-size: 13px; color: var(--plum-soft); margin: 0; }
  .ps-start { font-size: 30px; padding: 16px 52px; margin-top: 6px; }

  .modes { display: grid; gap: 14px; }
  .mode { display: flex; align-items: center; gap: 16px; text-align: left; padding: 14px 20px; }
  .mode .ico { font-size: 38px; line-height: 1; }
  .mode small { display: block; font-family: var(--body); font-size: 15px; opacity: .9; margin-top: 4px; }
  .mode.word { background: var(--r1); box-shadow: 0 7px 0 #D94E4E; }
  .mode.word:active { box-shadow: 0 2px 0 #D94E4E; }
  .mode.syll { background: var(--r2); box-shadow: 0 7px 0 #D9902E; }
  .mode.syll:active { box-shadow: 0 2px 0 #D9902E; }
  .mode.cons { background: var(--r6); box-shadow: 0 7px 0 #9560C0; }
  .mode.cons:active { box-shadow: 0 2px 0 #9560C0; }
  .mode.order { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .mode.order:active { box-shadow: 0 2px 0 #3F8FC2; }
  .mode.e { background: var(--r4); box-shadow: 0 7px 0 #5FB25A; } .mode.e:active { box-shadow: 0 2px 0 #5FB25A; }
  .mode.f { background: #F2C94C; box-shadow: 0 7px 0 #C9A227; } .mode.f:active { box-shadow: 0 2px 0 #C9A227; }
  @media (min-width: 600px) { .modes { grid-template-columns: 1fr 1fr; } }
  .best { text-align: center; font-size: 15px; color: var(--plum-soft); margin: 14px 0 0; line-height: 1.6; }

  .stars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .stars span { font-size: 24px; filter: grayscale(1) opacity(.35); transition: transform .3s, filter .3s; }
  .stars span.on { filter: none; transform: scale(1.15); }

  .pic { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 10px; }
  .pic .emoji {
    font-size: 96px; line-height: 1; width: 150px; height: 150px; display: grid; place-items: center;
    background: var(--ground-2); border-radius: 40px; border: 4px solid #FFD6E7;
    animation: pop .45s backwards;
  }
  .pic .emoji.small { font-size: 56px; width: 96px; height: 96px; border-radius: 28px; }
  .speak {
    background: #fff; border: 3px solid var(--r5); color: #2E7DB3; border-radius: 30px;
    font-family: var(--display); font-size: 18px; padding: 8px 18px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 0 #BFE0F5;
  }
  .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #BFE0F5; }
  .speak:focus-visible { outline: 4px solid var(--r2); outline-offset: 3px; }
  .ask { text-align: center; font-size: 17px; color: var(--plum-soft); margin: 4px 0 8px; }

  /* 낱말 칸 */
  .word {
    display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--display); font-size: clamp(40px, 12vw, 60px); line-height: 1; margin: 6px 0 20px;
  }
  .word .ch {
    display: inline-grid; place-items: center; min-width: 1.25em; height: 1.25em; border-radius: 20px;
    background: var(--ground-2); border: 4px solid #FFD6E7; color: var(--plum);
  }
  .word .ch.blank { border: 4px dashed var(--pink); color: var(--pink); }
  .word .ch.focus { border-color: var(--pink); background: #FFE4F0; color: var(--pink-deep); }
  .word .ch.ok { border-style: solid; background: var(--good); border-color: #4DB369; color: #fff; }
  .word .ch.no { border-color: var(--oops); animation: shake .4s; }
  .word .ch.hint { font-size: .55em; color: var(--plum-soft); }
  .word .ch.slot { cursor: pointer; }
  .word .ch.slot.filled { background: var(--r3); border-color: #E8CF4A; color: var(--plum); }
  .word .ch.slot.reveal { background: var(--r2); border-color: #D9902E; color: #fff; }
  .tile.hint { outline: 5px solid var(--r3); outline-offset: 3px; animation: hintpulse .8s infinite alternate; }
  @keyframes hintpulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  .word.longword { font-size: clamp(30px, 9vw, 46px); gap: 6px; }
  .word.longword .ch { border-radius: 14px; border-width: 3px; }
  /* 문장 칸 */
  .word.sentence { font-size: clamp(22px, 6vw, 30px); gap: 6px 8px; line-height: 1.3; }
  .word.sentence .ch { min-width: 0; height: auto; padding: 8px 12px; border-radius: 14px; border-width: 3px; }
  .word.sentence .plain { background: none; border-color: transparent; padding: 8px 2px; }
  .word.sentence .ch.blank { min-width: 3.2em; }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choices.four { grid-template-columns: repeat(2, 1fr); }
  .choices.five { grid-template-columns: repeat(3, 1fr); }
  .choice { font-size: 38px; padding: 14px 4px; word-break: keep-all; }
  .choice.long { font-size: 28px; }
  .choice.xlong { font-size: 22px; }
  .choice:nth-child(1) { background: var(--r1); box-shadow: 0 7px 0 #D94E4E; }
  .choice:nth-child(2) { background: var(--r2); box-shadow: 0 7px 0 #D9902E; }
  .choice:nth-child(3) { background: var(--r6); box-shadow: 0 7px 0 #9560C0; }
  .choice:nth-child(4) { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--good) !important; box-shadow: 0 7px 0 #4DB369 !important; }
  .choice.wrong { background: #E9C8D6 !important; box-shadow: 0 7px 0 #C9A6B8 !important; color: #fff; }

  /* 글자·낱말 타일 */
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .tile { font-size: 36px; padding: 12px 0; min-width: 76px; background: var(--r6); box-shadow: 0 7px 0 #9560C0; }
  .tile:nth-child(2n) { background: var(--r2); box-shadow: 0 7px 0 #D9902E; }
  .tile:nth-child(3n) { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .tile.used { visibility: hidden; }
  .tile:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .tiles.words .tile { font-size: 24px; padding: 12px 16px; min-width: 0; }
  .tools { display: flex; justify-content: center; margin-top: 12px; }
  .tools button {
    background: none; border: 2px solid #FFD6E7; border-radius: 30px; font-family: var(--body); font-size: 15px;
    color: var(--plum-soft); padding: 6px 16px; cursor: pointer;
  }

  .feedback { min-height: 34px; text-align: center; font-family: var(--display); font-size: 26px; margin-top: 16px; color: var(--pink-deep); }
  .feedback.good { color: #3FA85D; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; color: var(--plum-soft); }
  .topbar button { background: none; border: 0; font-family: var(--body); font-size: 15px; color: var(--plum-soft); cursor: pointer; text-decoration: underline; padding: 6px; }
  .topbar button:focus-visible { outline: 3px solid var(--r5); border-radius: 8px; }
  .tag { background: var(--ground-2); border: 2px solid #FFD6E7; border-radius: 20px; padding: 3px 10px; font-family: var(--display); }

  .result { text-align: center; }
  .result .big { font-size: 80px; line-height: 1; margin: 6px 0 10px; animation: bounce 1s infinite alternate; }
  .result h2 { font-family: var(--display); font-size: 34px; margin: 0 0 6px; color: var(--pink-deep); }
  .result p { margin: 0 0 20px; font-size: 18px; }
  .result .score { font-family: var(--display); font-size: 30px; color: var(--plum); }
  .result .learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .result .learned span { background: var(--ground-2); border: 2px solid #FFD6E7; border-radius: 30px; padding: 6px 12px; font-family: var(--display); font-size: 18px; }
  .result .actions { display: grid; gap: 12px; }
  .result .again { background: var(--r4); box-shadow: 0 7px 0 #5FB25A; }
  .result .home { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .result .hub { display: block; text-decoration: none; text-align: center; background: var(--pink); box-shadow: 0 7px 0 var(--pink-deep); }
  .hublink { display: inline-block; font-family: var(--body); font-size: 15px; color: var(--plum-soft); text-decoration: none; border: 2px solid #FFD6E7; border-radius: 30px; padding: 6px 14px; margin-bottom: 10px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  @keyframes bounce { from { transform: translateY(0);} to { transform: translateY(-14px);} }
  @media (prefers-reduced-motion: reduce) {
    .pic .emoji, .word .ch.no, .result .big { animation: none; }
    .btn, .stars span { transition: none; }
  }
  @media (max-width: 400px) {
    .choice { font-size: 32px; } .choice.long { font-size: 24px; } .choice.xlong { font-size: 19px; }
    .tile { font-size: 30px; min-width: 64px; }
    .tiles.words .tile { font-size: 20px; padding: 10px 12px; }
    .pic .emoji { font-size: 80px; width: 130px; height: 130px; }
    .card { padding: 20px 16px 22px; }
  }
</style>
<link rel="stylesheet" href="layout.css">
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="arch" aria-hidden="true">
    <svg viewBox="0 0 520 130" preserveAspectRatio="xMidYMax meet">
      <path d="M20 130 A240 240 0 0 1 500 130" fill="none" stroke="#FF6B6B" stroke-width="16"/>
      <path d="M36 130 A224 224 0 0 1 484 130" fill="none" stroke="#FFB347" stroke-width="16"/>
      <path d="M52 130 A208 208 0 0 1 468 130" fill="none" stroke="#FFE66D" stroke-width="16"/>
      <path d="M68 130 A192 192 0 0 1 452 130" fill="none" stroke="#7ED957" stroke-width="16"/>
      <path d="M84 130 A176 176 0 0 1 436 130" fill="none" stroke="#5DADE2" stroke-width="16"/>
      <path d="M100 130 A160 160 0 0 1 420 130" fill="none" stroke="#B57EDC" stroke-width="16"/>
    </svg>
    <div class="letters">
      <span style="left:24%;top:38%">ㄱ</span><span style="left:41%;top:16%">ㅏ</span>
      <span style="left:56%;top:16%">ㄴ</span><span style="left:72%;top:38%">ㅗ</span>
    </div>
    <div class="cloud l"></div>
    <div class="cloud r"></div>
  </div>

  <h1>무지개 한글 놀이</h1>
  <p class="sub">그림을 보고 맞는 글자를 눌러요 🌈</p>

  <section class="card" id="home">
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <p class="sub">몇 살 놀이로 할까요?</p>
    <div class="level" role="group" aria-label="난이도">
      <button type="button" id="level-easy" data-level="easy" aria-pressed="false">🌸 6살</button>
      <button type="button" id="level-hard" data-level="hard" aria-pressed="true">🦄 7살</button>
    </div>
    <p class="level-note" id="level-note"></p>
    <div class="modes">
      <button class="btn mode word" id="mode-word" data-mode="word"><span class="ico" id="ico-word">🍎</span><span id="label-word"></span></button>
      <button class="btn mode syll" id="mode-syll" data-mode="syll"><span class="ico" id="ico-syll">🐰</span><span id="label-syll"></span></button>
      <button class="btn mode cons" id="mode-cons" data-mode="cons"><span class="ico" id="ico-cons">🦄</span><span id="label-cons"></span></button>
      <button class="btn mode order" id="mode-order" data-mode="order"><span class="ico" id="ico-order">🧩</span><span id="label-order"></span></button>
      <button class="btn mode e" id="mode-e" data-mode="e"><span class="ico" id="ico-e"></span><span id="label-e"></span></button>
      <button class="btn mode f" id="mode-f" data-mode="f"><span class="ico" id="ico-f"></span><span id="label-f"></span></button>
    </div>
    <p class="best" id="best"></p>
  </section>

  <!-- 시작 전: 난이도 고르고 시작 -->
  <section class="card" id="prestart" hidden>
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <div class="ps">
      <div class="ps-ico" id="ps-ico"></div>
      <h2 class="ps-title" id="ps-title"></h2>
      <p class="ps-desc" id="ps-desc"></p>
      <p class="ps-level" id="ps-level"></p>
      <div class="diffrow" id="diffrow"><span>난이도</span><button type="button" data-diff="-3">−3</button><button type="button" data-diff="-2">−2</button><button type="button" data-diff="-1">−1</button><button type="button" data-diff="0">기본</button><button type="button" data-diff="1">+1</button><button type="button" data-diff="2">+2</button><button type="button" data-diff="3">+3</button></div>
      <p class="ps-note">쉬우면 시간이 넉넉하고 보기가 적어요. 어려우면 빨라지고 비슷한 보기가 늘어요. 이 놀이에만 적용돼요.</p>
      <button class="btn ps-start" id="ps-start">시작! ▶</button>
    </div>
  </section>

  <section class="card" id="game" hidden>
    <div class="topbar">
      <span id="round">1 / 10</span>
      <span class="tag" id="tag"></span>
      <button id="quit" type="button">처음으로</button>
    </div>
    <div class="stars" id="stars" aria-label="모은 별"></div>
    <div class="pic">
      <div class="emoji" id="emoji"></div>
      <button class="speak" id="speak" type="button">🔊 읽어 줘</button>
    </div>
    <p class="ask" id="ask"></p>
    <div class="word" id="word"></div>
    <div class="choices" id="choices"></div>
    <div class="tiles" id="tiles" hidden></div>
    <div class="tools" id="tools" hidden><button type="button" id="reset-tiles">↩ 다시 놓기</button></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <section class="card result" id="result" hidden>
    <div class="big" id="result-emoji">🎉</div>
    <h2 id="result-title">참 잘했어요!</h2>
    <p class="score" id="result-score"></p>
    <p id="result-msg"></p>
    <div class="learned" id="learned"></div>
    <div class="actions">
      <button class="btn again" id="again">한 번 더! 🌟</button>
      <button class="btn home" id="home-btn">처음으로 🏠</button>
      <a class="btn hub" id="to-hub" href="index.html" hidden>🏠 놀이터로 돌아가기</a>
    </div>
  </section>
</div>

<script>
(function () {
  let TOTAL = 10;
  const WORDS = [
    // 짧은 낱말 (6살·7살 공통)

    if (state.built.length === total) {
      const isSent = state.mode === 'order' && state.level === 'nine';
      const made = state.built.map(b => b.c).join(isSent ? ' ' : '');
      if (made === q.ans) {
        document.querySelectorAll('.slot').forEach(s => s.classList.add('ok'));
        correct(q);
      } else {
        state.missed = true;
        document.querySelectorAll('.slot').forEach(s => { s.classList.remove('no'); void s.offsetWidth; s.classList.add('no'); });
        state.wrongTiles = (state.wrongTiles || 0) + 1;
        if (state.wrongTiles >= 3) { sndBad(); return setTimeout(revealTiles, 500); }
        const hintNow = state.wrongTiles >= (DIFF <= -1 ? 1 : 2) && DIFF < 2;
        $("feedback").textContent = hintNow ? "반짝이는 글자부터 눌러 봐요 ✨" : "순서가 달라요. 다시 놓아 볼까요? 🍀";
        sndBad();
        setTimeout(() => { resetTiles(); if (hintNow) hintTile(); }, 700);
      }
    }
  }
  function tapSlot(slot) {
    if (state.locked) return;
    if (slot.classList.contains("reveal")) return;
    const i = +slot.dataset.i;
    if (i !== state.built.length - 1) return; // 마지막에 놓은 것만 되돌리기
    const b = state.built.pop();
    $(b.tile).classList.remove('used');
    slot.innerHTML = state.mode === 'order' && state.level === 'nine' ? '&nbsp;' : ''; slot.classList.remove('filled');
    sndTap();
  }
  function resetTiles() {
    if (state.locked) return;
    state.built = [];
    document.querySelectorAll('.tile').forEach(t => t.classList.remove('used'));
    document.querySelectorAll('.slot').forEach(s => { s.innerHTML = state.mode === 'order' && state.level === 'nine' ? '&nbsp;' : ''; s.classList.remove('filled', 'no'); });
  }

  function next() {
    state.round++;
    if (state.round >= TOTAL) return finish();
    state.q = makeQ(); renderQ();
  }

  function start(mode) {
    state = { mode, level, round: 0, score: 0, q: null, locked: false, deck: [], learned: [], built: [] };
    state.q = makeQ();
    show('game'); renderQ();
  }

  function finish() {
    saveBest();
    const s = state.score, L = state.level;
    $('result-score').textContent = '⭐ ' + s + ' / ' + TOTAL;
    if (s === TOTAL) {
      $('result-emoji').textContent = '🦄'; $('result-title').textContent = '완벽해요! 한글 박사님!';
      $('result-msg').textContent = L === 'easy' ? '이제 7살 놀이에 도전해 볼까요?' : L === 'hard' ? '이제 8살 놀이에 도전해 볼까요?' : L === 'pro' ? '이제 9살 놀이에 도전해 볼까요?' : '별 열 개를 모두 모았어요. 한글 왕이에요!';
    }
    else if (s >= 7) { $('result-emoji').textContent = '🌈'; $('result-title').textContent = '정말 잘했어요!'; $('result-msg').textContent = '조금만 더 하면 별을 다 모을 수 있어요.'; }
    else { $('result-emoji').textContent = '🌸'; $('result-title').textContent = '열심히 했어요!'; $('result-msg').textContent = '읽어 줘 버튼을 누르고 따라 읽어 보세요.'; }
    $('learned').innerHTML = state.learned.map(w => `<span>${w}</span>`).join('');
    show('result'); sndWin(); confetti(120);
  }

  function show(id) {
    ["home","game","result","prestart"].forEach(x => $(x).hidden = x !== id);
    if (id === "home") loadBest();
    if (id === "result") reportMission();
  }
  function setLevel(l) {
    level = l;
    document.querySelectorAll('.level button').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === l ? 'true' : 'false'));
    $('level-note').textContent = LEVEL_NOTE[l];
    renderDiff();
    for (const m of ["word","syll","cons","order","e","f"]) {
      const [ico, title, small] = MODE_LABEL[l][m];
      $('ico-' + m).textContent = ico;
      $('label-' + m).innerHTML = title + '<small>' + small + '</small>';
    }
    try { localStorage.setItem('rainbow-hangul-level', l); } catch (e) {}
  }

  document.querySelectorAll('.level button').forEach(b => b.addEventListener('click', () => setLevel(b.dataset.level)));
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => openPrestart(b.dataset.mode)));
  $('choices').addEventListener('click', e => { const b = e.target.closest('.choice'); if (b) answer(b); });
  $('tiles').addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) tapTile(b); });
  $('word').addEventListener('click', e => { const s = e.target.closest('.slot'); if (s) tapSlot(s); });
  $('reset-tiles').addEventListener('click', resetTiles);
  $('speak').addEventListener('click', () => {
    if (!state.q) return;
    const q = state.q, L = state.level, m = state.mode;
    speak(L === 'nine' && m === 'order' ? q.sent : L === 'nine' && m === 'cons' ? q.sent.replace(q.w, '땡') : q.w);
  });
  $('again').addEventListener('click', () => start(state.mode));
  $("home-btn").addEventListener("click", () => { location.href = "index.html"; });
  $("quit").addEventListener("click", () => { location.href = "index.html"; });
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  /* 놀이터(index.html) 미션 연동 */
  let missionId = null;
  function reportMission() {
    const missionId = GAME_KEY + ":" + state.level + ":" + state.mode;   // 오늘 한 놀이로 기록
    try {
      const key = "rp-results", all = JSON.parse(localStorage.getItem(key) || "{}");
      const d = new Date(), day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      all[day] = all[day] || {};
      all[day][missionId] = Math.max(all[day][missionId] || 0, Math.round(state.score * 10 / TOTAL));
      localStorage.setItem(key, JSON.stringify(all));
      // 뽑기 에너지용 기록: 놀이를 마칠 때마다 한 줄씩
      const lg = JSON.parse(localStorage.getItem("rp-log") || "[]"); lg.push({ t: Date.now(), id: missionId, score: Math.round(state.score * 10 / TOTAL) }); if (lg.length > 500) lg.splice(0, lg.length - 500); localStorage.setItem("rp-log", JSON.stringify(lg));
    } catch (e) {}
    $("to-hub").hidden = true; $("home-btn").hidden = false;
  }
  function launchFromUrl() {
    const p = new URLSearchParams(location.search);
    const l = p.get("level"), m = p.get("mode");
    if (!m || !LEVEL_NAME[l] || !MODE_LABEL[l] || !MODE_LABEL[l][m]) return false;
    missionId = GAME_KEY + ":" + l + ":" + m;
    const n = +p.get("n"); if (n === 5 || n === 10) TOTAL = n;
    setLevel(l); openPrestart(m); return true;
  }
  function renderDiff() {
    document.querySelectorAll("#diffrow button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.diff === DIFF ? "true" : "false"));
  }
  document.querySelectorAll("#diffrow button").forEach(b => b.addEventListener("click", () => { DIFF = +b.dataset.diff; try { localStorage.setItem(diffKey(pendingMode || (state && state.mode) || "x"), DIFF); } catch (e) {} renderDiff(); }));
  $("ps-start").addEventListener("click", () => { if (pendingMode) start(pendingMode); });
  function boot(data) {
    let saved = 'hard';
    try { saved = localStorage.getItem('rainbow-hangul-level') || 'hard'; } catch (e) {}
    if (!LEVEL_NAME[saved]) saved = 'hard';
    if (saved === "pro" || saved === "nine") saved = "hard";   // 8살·9살은 숨김
    setLevel(saved);
    if (launchFromUrl()) return;
    if (data && data.state && data.state.q && data.screen === 'game' && LEVEL_NAME[data.state.level]) {
      state = data.state; level = state.level; setLevel(level); show('game'); renderQ();
    } else show('home');
  }
  if (window.claude?.hot?.snapshot) {
    window.claude.hot.snapshot(() => ({ state, screen: $('game').hidden ? ($('result').hidden ? 'home' : 'result') : 'game' }));
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
