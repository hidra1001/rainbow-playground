<title>무지개 산수 놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root {
    --ground: #FFE4F0;
    --ground-2: #FFF3F8;
    --card: #FFFFFF;
    --pink: #FF5FA2;
    --pink-deep: #E8408A;
    --plum: #5B2A4E;
    --plum-soft: #9A6A8C;
    --r1: #FF6B6B; --r2: #FFB347; --r3: #FFE66D; --r4: #7ED957; --r5: #5DADE2; --r6: #B57EDC;
    --good: #5FC97A;
    --oops: #FF8A80;
    --display: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background: var(--ground);
    background-image:
      radial-gradient(circle at 15% 20%, #FFD1E6 0 60px, transparent 61px),
      radial-gradient(circle at 85% 30%, #FFD9EA 0 80px, transparent 81px),
      radial-gradient(circle at 70% 85%, #FFCCE2 0 50px, transparent 51px),
      radial-gradient(circle at 20% 80%, #FFDDEC 0 70px, transparent 71px);
    color: var(--plum);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 20px 40px;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .arch { position: relative; height: 120px; overflow: hidden; margin-bottom: -20px; }
  .arch svg { width: 100%; height: 100%; display: block; }
  .cloud { position: absolute; bottom: 4px; width: 88px; height: 34px; background: #fff; border-radius: 40px; box-shadow: 0 6px 0 #FFD1E6; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 42px; height: 42px; left: 10px; top: -20px; }
  .cloud::after { width: 32px; height: 32px; right: 12px; top: -12px; }
  .cloud.l { left: 2%; } .cloud.r { right: 2%; }
  .digits { position: absolute; inset: 0; pointer-events: none; font-family: var(--display); font-size: 26px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.08); }
  .digits span { position: absolute; }

  h1 {
    font-family: var(--display);
    font-size: clamp(34px, 9vw, 46px);
    text-align: center; margin: 0; line-height: 1.1; text-wrap: balance;
    background: linear-gradient(90deg, var(--r1), var(--r2), #F2C94C, var(--r4), var(--r5), var(--r6));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #fff);
  }
  .sub { text-align: center; margin: 0; font-size: 17px; color: var(--plum-soft); }

  .card {
    background: var(--card); border-radius: 32px; padding: 24px 22px 26px;
    box-shadow: 0 10px 0 #FFC2DB, 0 16px 30px rgba(232, 64, 138, .15);
    border: 4px solid #FFD6E7;
  }
  [hidden] { display: none !important; }

  .btn {
    font-family: var(--display); font-size: 26px; border: 0; border-radius: 24px;
    padding: 16px 20px; cursor: pointer; color: #fff; background: var(--pink);
    box-shadow: 0 7px 0 var(--pink-deep);
    transition: transform .08s ease, box-shadow .08s ease; touch-action: manipulation; line-height: 1.1;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--pink-deep); }
  .btn:focus-visible { outline: 4px solid var(--r5); outline-offset: 3px; }

  .level { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 16px; }
  .level button {
    font-family: var(--display); font-size: 20px; padding: 10px 16px; border-radius: 30px; cursor: pointer;
    border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft);
  }
  .level button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 4px 0 var(--pink-deep); }
  .level button:focus-visible { outline: 4px solid var(--r5); outline-offset: 2px; }
  .level-note { text-align: center; font-size: 14px; color: var(--plum-soft); margin: -6px 0 10px; }
  .diffrow { display: flex; gap: 5px; justify-content: center; align-items: center; flex-wrap: wrap; margin: -2px 0 12px; font-size: 14px; color: var(--plum-soft); }
  .diffrow span { margin-right: 4px; }
  .diffrow button { font-family: var(--display); font-size: 15px; min-width: 40px; height: 38px; padding: 0 8px; border-radius: 20px; border: 3px solid #FFD6E7; background: var(--ground-2); color: var(--plum-soft); cursor: pointer; }
  .diffrow button[aria-pressed="true"] { background: var(--pink); border-color: var(--pink-deep); color: #fff; box-shadow: 0 3px 0 var(--pink-deep); }
  .ps { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 8px 0 6px; }
  .ps-ico { font-size: 64px; line-height: 1; }
  .ps-title { font-family: var(--display); font-size: 32px; margin: 0; font-weight: normal; }
  .ps-desc { margin: 0; color: var(--plum-soft); font-size: 17px; }
  .ps-level { margin: 0; font-family: var(--display); color: var(--pink-deep); font-size: 18px; }
  .ps-note { font-size: 13px; color: var(--plum-soft); margin: 0; }
  .ps-start { font-size: 30px; padding: 16px 52px; margin-top: 6px; }

  .modes { display: grid; gap: 14px; }
  .mode { display: flex; align-items: center; gap: 16px; text-align: left; padding: 14px 20px; }
  .mode .ico { font-size: 38px; line-height: 1; }
  .mode small { display: block; font-family: var(--body); font-size: 15px; opacity: .9; margin-top: 4px; }
  .mode.a { background: var(--r4); box-shadow: 0 7px 0 #5FB25A; } .mode.a:active { box-shadow: 0 2px 0 #5FB25A; }
  .mode.b { background: var(--r2); box-shadow: 0 7px 0 #D9902E; } .mode.b:active { box-shadow: 0 2px 0 #D9902E; }
  .mode.c { background: var(--r6); box-shadow: 0 7px 0 #9560C0; } .mode.c:active { box-shadow: 0 2px 0 #9560C0; }
  .mode.d { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; } .mode.d:active { box-shadow: 0 2px 0 #3F8FC2; }
  .mode.e { background: var(--r1); box-shadow: 0 7px 0 #D94E4E; } .mode.e:active { box-shadow: 0 2px 0 #D94E4E; }
  .mode.f { background: #F2C94C; box-shadow: 0 7px 0 #C9A227; } .mode.f:active { box-shadow: 0 2px 0 #C9A227; }
  @media (min-width: 600px) { .modes { grid-template-columns: 1fr 1fr; } }
  .story { font-family: var(--body); font-size: 19px; line-height: 1.6; background: var(--ground-2); border: 3px solid #FFD6E7; border-radius: 20px; padding: 14px 18px; text-align: left; max-width: 34em; word-break: keep-all; }
  .stage-hint { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
  .money { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 420px; }
  .coin { display: inline-grid; place-items: center; border-radius: 50%; font-family: var(--display); color: #6B4A00; border: 3px solid; }
  .coin.c10 { width: 40px; height: 40px; font-size: 14px; background: #E9A86B; border-color: #C9853F; }
  .coin.c50 { width: 46px; height: 46px; font-size: 15px; background: #E8E8E8; border-color: #B8B8B8; color: #444; }
  .coin.c100 { width: 54px; height: 54px; font-size: 17px; background: #EDEDED; border-color: #B0B0B0; color: #333; }
  .coin.c500 { width: 64px; height: 64px; font-size: 19px; background: #F2F2F2; border-color: #A8A8A8; color: #222; }
  .bill { display: inline-grid; place-items: center; width: 110px; height: 54px; border-radius: 8px; background: #CFE3F5; border: 3px solid #7FA8D0; font-family: var(--display); font-size: 20px; color: #1F4E79; }
  .best { text-align: center; font-size: 15px; color: var(--plum-soft); margin: 14px 0 0; line-height: 1.6; }

  .stars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .stars span { font-size: 24px; filter: grayscale(1) opacity(.35); transition: transform .3s, filter .3s; }
  .stars span.on { filter: none; transform: scale(1.15); }
  .stars span.miss { filter: grayscale(1) opacity(.6); }

  .ask { text-align: center; font-size: 17px; color: var(--plum-soft); margin: 4px 0 10px; }

  /* 무대: 그림·시계·세로셈 */
  .stage { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px; min-height: 60px; margin-bottom: 10px; }
  .group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 10px; border-radius: 18px; background: var(--ground-2); border: 3px solid #FFD6E7; }
  .group i { font-style: normal; font-size: 26px; line-height: 1; text-align: center; animation: pop .4s backwards; }
  .group i.gone { opacity: .25; filter: grayscale(1); }
  .group.wide { grid-template-columns: repeat(10, 1fr); }
  .opsign { font-family: var(--display); font-size: 40px; color: var(--pink); }
  .tenframe { display: grid; grid-template-columns: repeat(5, 40px); gap: 5px; padding: 8px; border-radius: 16px; background: var(--ground-2); border: 3px solid #FFD6E7; }
  .tenframe i { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #FFB3D1; background: #fff; }
  .tenframe i.on { background: var(--pink); border-color: var(--pink-deep); }
  .tenframe i.q { background: repeating-linear-gradient(45deg, #FFE4F0 0 4px, #fff 4px 8px); border-style: dashed; }
  .dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .dots .g { display: grid; grid-template-columns: repeat(3, 14px); gap: 4px; padding: 6px; border-radius: 12px; background: var(--ground-2); border: 2px solid #FFD6E7; }
  .dots .g i { width: 14px; height: 14px; border-radius: 50%; background: var(--r6); }
  .bond { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; justify-items: center; align-items: center; font-family: var(--display); font-size: 36px; }
  .bond .n { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: var(--ground-2); border: 4px solid var(--r5); color: var(--plum); }
  .bond .top { grid-column: 1 / 3; border-color: var(--pink); }
  .bond .n.q { border-style: dashed; color: var(--pink); }
  .column { font-family: var(--display); font-size: clamp(40px, 12vw, 56px); font-variant-numeric: tabular-nums; text-align: right; line-height: 1.15; padding: 8px 18px; background: var(--ground-2); border-radius: 20px; border: 3px solid #FFD6E7; }
  .column .row { display: flex; justify-content: flex-end; gap: .3em; }
  .column .row.op { border-bottom: 4px solid var(--plum); padding-bottom: 4px; }
  .column .row.op span:first-child { color: var(--pink); }
  .column .ans { color: var(--pink); min-height: 1.15em; }
  .column .ans.no { animation: shake .4s; color: var(--oops); }
  .clock { width: 190px; height: 190px; }

  /* 식 */
  .eq {
    font-family: var(--display);
    font-size: clamp(38px, 11vw, 60px);
    text-align: center; line-height: 1; margin: 6px 0 18px;
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .eq .sign { color: var(--pink); }
  .eq .box {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.4em; height: 1.35em; padding: 0 .2em; border-radius: 20px;
    border: 4px dashed var(--pink); color: var(--pink); font-size: .9em; background: var(--ground-2);
  }
  .eq .box.ok { border-style: solid; background: var(--good); color: #fff; border-color: #4DB369; }
  .eq .box.no { border-color: var(--oops); animation: shake .4s; }
  .eq .box.reveal { border-style: solid; background: var(--r2); color: #fff; border-color: #D9902E; }
  .eq.seq .cell { display: inline-grid; place-items: center; min-width: 1.4em; height: 1.35em; padding: 0 .2em; border-radius: 16px; background: var(--ground-2); border: 3px solid #FFD6E7; font-size: .8em; }
  .eq.small { font-size: clamp(30px, 8vw, 44px); }

  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .choices.four { grid-template-columns: repeat(2, 1fr); }
  .choices.five { grid-template-columns: repeat(3, 1fr); }
  .choice { font-size: 38px; padding: 14px 4px; font-variant-numeric: tabular-nums; }
  .choice.long { font-size: 26px; }
  .choice:nth-child(1) { background: var(--r1); box-shadow: 0 7px 0 #D94E4E; }
  .choice:nth-child(2) { background: var(--r2); box-shadow: 0 7px 0 #D9902E; }
  .choice:nth-child(3) { background: var(--r6); box-shadow: 0 7px 0 #9560C0; }
  .choice:nth-child(4) { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .choice:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .choice:disabled { cursor: default; }
  .choice.right { background: var(--good) !important; box-shadow: 0 7px 0 #4DB369 !important; }
  .choice.wrong { background: #E9C8D6 !important; box-shadow: 0 7px 0 #C9A6B8 !important; color: #fff; }

  /* 숫자판 */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 0 auto; }
  .pad .btn { font-size: 30px; padding: 12px 0; background: var(--r5); box-shadow: 0 6px 0 #3F8FC2; }
  .pad .btn:active { box-shadow: 0 2px 0 #3F8FC2; }
  .pad .btn.del { background: var(--r2); box-shadow: 0 6px 0 #D9902E; font-size: 24px; }
  .pad .btn.ok { background: var(--r4); box-shadow: 0 6px 0 #5FB25A; }

  .feedback { min-height: 34px; text-align: center; font-family: var(--display); font-size: 26px; margin-top: 16px; color: var(--pink-deep); }
  .feedback.good { color: #3FA85D; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 15px; color: var(--plum-soft); }
  .topbar button { background: none; border: 0; font-family: var(--body); font-size: 15px; color: var(--plum-soft); cursor: pointer; text-decoration: underline; padding: 6px; }
  .topbar button:focus-visible { outline: 3px solid var(--r5); border-radius: 8px; }
  .tag { background: var(--ground-2); border: 2px solid #FFD6E7; border-radius: 20px; padding: 3px 10px; font-family: var(--display); }

  .result { text-align: center; }
  .result .big { font-size: 80px; line-height: 1; margin: 6px 0 10px; animation: bounce 1s infinite alternate; }
  .result h2 { font-family: var(--display); font-size: 34px; margin: 0 0 6px; color: var(--pink-deep); }
  .result p { margin: 0 0 20px; font-size: 18px; }
  .result .score { font-family: var(--display); font-size: 30px; color: var(--plum); margin-bottom: 4px; }
  .result .time { font-size: 16px; color: var(--plum-soft); margin-bottom: 18px; }
  .result .review { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .result .review span { background: #FFF0E6; border: 2px solid #FFD1B3; border-radius: 30px; padding: 6px 12px; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
  .result .actions { display: grid; gap: 12px; }
  .result .again { background: var(--r4); box-shadow: 0 7px 0 #5FB25A; }
  .result .home { background: var(--r5); box-shadow: 0 7px 0 #3F8FC2; }
  .result .hub { display: block; text-decoration: none; text-align: center; background: var(--pink); box-shadow: 0 7px 0 var(--pink-deep); }
  .hublink { display: inline-block; font-family: var(--body); font-size: 15px; color: var(--plum-soft); text-decoration: none; border: 2px solid #FFD6E7; border-radius: 30px; padding: 6px 14px; margin-bottom: 10px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-8px);} 75% { transform: translateX(8px);} }
  @keyframes bounce { from { transform: translateY(0);} to { transform: translateY(-14px);} }
  @media (prefers-reduced-motion: reduce) {
    .group i, .eq .box.no, .result .big { animation: none; }
    .btn, .stars span { transition: none; }
  }
  @media (max-width: 400px) {
    .choice { font-size: 32px; } .choice.long { font-size: 22px; }
    .group i { font-size: 22px; }
    .tenframe { grid-template-columns: repeat(5, 34px); } .tenframe i { width: 34px; height: 34px; }
    .card { padding: 20px 16px 22px; }
  }
</style>

</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div class="arch" aria-hidden="true">
    <svg viewBox="0 0 520 130" preserveAspectRatio="xMidYMax meet">
      <path d="M20 130 A240 240 0 0 1 500 130" fill="none" stroke="#FF6B6B" stroke-width="16"/>
      <path d="M36 130 A224 224 0 0 1 484 130" fill="none" stroke="#FFB347" stroke-width="16"/>
      <path d="M52 130 A208 208 0 0 1 468 130" fill="none" stroke="#FFE66D" stroke-width="16"/>
      <path d="M68 130 A192 192 0 0 1 452 130" fill="none" stroke="#7ED957" stroke-width="16"/>
      <path d="M84 130 A176 176 0 0 1 436 130" fill="none" stroke="#5DADE2" stroke-width="16"/>
      <path d="M100 130 A160 160 0 0 1 420 130" fill="none" stroke="#B57EDC" stroke-width="16"/>
    </svg>
    <div class="digits">
      <span style="left:24%;top:38%">1</span><span style="left:41%;top:16%">+</span>
      <span style="left:56%;top:16%">2</span><span style="left:72%;top:38%">=</span>
    </div>
    <div class="cloud l"></div>
    <div class="cloud r"></div>
  </div>

  <h1>무지개 산수 놀이</h1>
  <p class="sub">문제를 풀고 별을 모아요 🌈</p>

  <section class="card" id="home">
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <p class="sub">몇 살 놀이로 할까요?</p>
    <div class="level" role="group" aria-label="난이도">
      <button type="button" id="level-easy" data-level="easy" aria-pressed="true">🌸 6살</button>
    </div>
    <p class="level-note" id="level-note"></p>
    <div class="modes">
      <button class="btn mode a" id="mode-a" data-mode="a"><span class="ico" id="ico-a"></span><span id="label-a"></span></button>
      <button class="btn mode b" id="mode-b" data-mode="b"><span class="ico" id="ico-b"></span><span id="label-b"></span></button>
      <button class="btn mode c" id="mode-c" data-mode="c"><span class="ico" id="ico-c"></span><span id="label-c"></span></button>
      <button class="btn mode d" id="mode-d" data-mode="d"><span class="ico" id="ico-d"></span><span id="label-d"></span></button>
      <button class="btn mode e" id="mode-e" data-mode="e"><span class="ico" id="ico-e"></span><span id="label-e"></span></button>
      <button class="btn mode f" id="mode-f" data-mode="f"><span class="ico" id="ico-f"></span><span id="label-f"></span></button>
    </div>
    <p class="best" id="best"></p>
  </section>

  <!-- 시작 전: 난이도 고르고 시작 -->
  <section class="card" id="prestart" hidden>
    <a class="hublink" href="index.html">🏠 놀이터로 돌아가기</a>
    <div class="ps">
      <div class="ps-ico" id="ps-ico"></div>
      <h2 class="ps-title" id="ps-title"></h2>
      <p class="ps-desc" id="ps-desc"></p>
      <p class="ps-level" id="ps-level"></p>
      <div class="diffrow" id="diffrow"><span>난이도</span><button type="button" data-diff="-3">−3</button><button type="button" data-diff="-2">−2</button><button type="button" data-diff="-1">−1</button><button type="button" data-diff="0">기본</button><button type="button" data-diff="1">+1</button><button type="button" data-diff="2">+2</button><button type="button" data-diff="3">+3</button></div>
      <p class="ps-note">쉬우면 시간이 넉넉하고 보기가 적어요. 어려우면 빨라지고 비슷한 보기가 늘어요. 이 놀이에만 적용돼요.</p>
      <button class="btn ps-start" id="ps-start">시작! ▶</button>
    </div>
  </section>

  <section class="card" id="game" hidden>
    <div class="topbar">
      <span id="round">1 / 10</span>
      <span class="tag" id="tag"></span>
      <button id="quit" type="button">처음으로</button>
    </div>
    <div class="stars" id="stars" aria-label="모은 별"></div>
    <p class="ask" id="ask"></p>

</div>

<script>
(function () {
  let TOTAL = 10;
  const FRUITS = ['🍓','🍎','🍊','🍇','🌸','⭐','🍬','🍪','🧁','🎈','🐣','🦋'];
  const PRAISE = ['참 잘했어요!', '딩동댕!', '와, 대단해!', '정답이에요!', '최고예요!', '멋져요!'];
  const LEVEL_NAME = { five: "5살", easy: '6살', hard: '7살', pro: '8살', nine: '9살' };
  /* 난이도 조정 (-3에서 +3): 놀이터 설정(rp-diff)이나 주소의 diff= 로 정해요 */
  let DIFF = 0;
  { const d = new URLSearchParams(location.search).get("diff"); if (d !== null && d !== "" && Math.abs(+d) <= 3) DIFF = +d; }
  const TS = () => 1 - EFF() * .16;                                    // 시간 배율: 쉬우면 더 길게, 어려우면 더 짧게
  const DIFF_TXT = () => DIFF ? (EFF() > 0 ? " +" + DIFF : " " + DIFF) : "";
  const EFF = () => level === "five" ? Math.max(-3, DIFF - 2) : DIFF;   // 5살은 6살 놀이를 두 단계 더 쉽게
  const GAME_KEY = "math";
  let pendingMode = null;
  const diffKey = m => "rp-diff:" + GAME_KEY + ":" + m;
  function loadDiffFor(m) { try { const v = localStorage.getItem(diffKey(m)); DIFF = v === null ? 0 : Math.max(-3, Math.min(3, +v || 0)); } catch (e) { DIFF = 0; } }
  function openPrestart(m) {
    pendingMode = m; loadDiffFor(m); renderDiff();
    const [ico, title, small] = MODE_LABEL[level][m];
    $("ps-ico").textContent = ico; $("ps-title").textContent = title; $("ps-desc").textContent = small;
    $("ps-level").textContent = LEVEL_NAME[level] + " 놀이";
    show("prestart");
  }
  const LEVEL_NOTE = {
    five: "5까지 수 · 그림 세기 · 보기 2~3개 · 아주 천천히",
    easy: '10까지 더하기·빼기 · 20까지 세기 · 10 만들기 · 빠진 수',
    hard: '받아올림 있는 20까지 · 가르기와 모으기 · 세 수 계산 · 뛰어 세기',
    pro: '두 자리 세로셈 · 세 수 섞어 계산 · 구구단 2~5단 · 시계 읽기 (숫자 직접 입력)',
    nine: '세 자리 세로셈 · 구구단 2~9단과 빈칸 · 나눗셈 · 수의 규칙 찾기'
  };
  const MODE_LABEL = {
    easy: { a: ['🍓','더하기 빼기','그림을 세어 10까지 더하고 빼요'], b: ['🔢','몇 개일까?','그림을 세어 20까지 수를 찾아요'], c: ['🔟','10 만들기','몇을 더해야 10이 될까요?'], d: ['🚂','빠진 수 찾기','1부터 30까지 수의 순서를 채워요'] , e: ["📖","문장제","이야기를 읽고 몇 개인지 구해요"], f: ["🪙","돈 세기","100원, 10원 동전을 세어요"] },
    hard: { a: ['➕','20까지 더하기 빼기','받아올림·받아내림이 있어요'], b: ['🥚','가르기와 모으기','9는 4와 몇으로 가를까요?'], c: ['🎯','세 수 계산','3 + 4 + 2 처럼 세 수를 계산해요'], d: ['🐇','뛰어 세기','2씩, 5씩, 10씩 뛰어 세어요'] , e: ["📖","문장제","버스에 몇 명? 몇 개 더 있어야 할까?"], f: ["🪙","돈 세기","100원, 50원, 10원을 세어요"] },
    pro:  { a: ['📝','두 자리 세로셈','받아올림·받아내림 있는 두 자리 수'], b: ['🎯','세 수 섞어 계산','23 + 18 − 9 처럼 계산해요'], c: ['✖️','구구단 2~5단','묶음 그림을 보며 곱셈을 해요'], d: ['🕒','시계 읽기','몇 시, 몇 시 30분을 읽어요'] , e: ["📖","문장제","곱셈이 들어간 이야기 문제 (입력)"], f: ["🪙","돈 세기","500원까지 동전을 세어요 (입력)"] },
    nine: { a: ['📝','세 자리 세로셈','356 + 278, 503 − 247 처럼 계산해요'], b: ['✖️','구구단 2~9단','빈칸이 있는 곱셈도 나와요'], c: ['➗','나눗셈','구구단을 거꾸로! 42 ÷ 6'], d: ["🔮","규칙 찾기·시계","수의 규칙과 5분 단위 시계 읽기"] , e: ["📖","문장제","두 단계로 푸는 이야기 문제 (입력)"], f: ["🪙","돈과 거스름돈","1000원 지폐와 거스름돈 (입력)"] },
  };
  MODE_LABEL.five = MODE_LABEL.easy;
  const modeName = (m, l) => MODE_LABEL[l][m][1];
  const $ = id => document.getElementById(id);
  const rnd = n => Math.floor(Math.random() * n);
  const rng = (a, b) => a + rnd(b - a + 1);
  const pick = a => a[rnd(a.length)];
  const shuffle = a => a.slice().sort(() => Math.random() - .5);

  let level = 'hard';
  let state = { mode: 'a', level, round: 0, score: 0, q: null, locked: false, tries: 0, typed: '', startedAt: 0, review: [] };

  /* 소리 */
  let ac = null;
  function tone(freq, t0, dur, type = 'sine', vol = .18) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ac.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t0 + dur);
      o.connect(g).connect(ac.destination);
      o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur);
    } catch (e) {}
  }
  const sndGood = () => { tone(523, 0, .15); tone(659, .12, .15); tone(784, .24, .3); };
  const sndBad = () => { tone(220, 0, .25, 'triangle', .12); };
  const sndTap = () => { tone(880, 0, .06, 'sine', .08); };
  const sndWin = () => { [523,659,784,1047,784,1047].forEach((f,i)=>tone(f, i*.13, .25)); };

  /* 색종이 */
  const cv = $('confetti'), cx = cv.getContext('2d');
  let bits = [], raf = null;
  function resize() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', resize); resize();
  function confetti(n) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#FF6B6B','#FFB347','#FFE66D','#7ED957','#5DADE2','#B57EDC','#FF5FA2'];
    for (let i = 0; i < n; i++) bits.push({
      x: cv.width / 2 + (Math.random() - .5) * 200, y: cv.height * .45,
      vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4,
      r: 4 + Math.random() * 6, c: colors[i % colors.length], a: Math.random() * 6, s: (Math.random() - .5) * .3
    });
    if (!raf) loop();
  }
  function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    bits = bits.filter(b => b.y < cv.height + 20);
    for (const b of bits) {
      b.vy += .35; b.x += b.vx; b.y += b.vy; b.a += b.s; b.vx *= .99;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.a); cx.fillStyle = b.c;
      cx.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); cx.restore();
    }
    raf = bits.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), null);
  }

  /* 최고 기록 */
  const bestKey = (l, m) => 'rainbow-math-best-' + l + '-' + m;
  function loadBest() {
    try {
      const lines = Object.keys(LEVEL_NAME).map(l => {
        const parts = Object.keys(MODE_LABEL[l]).map(m => {
          const v = localStorage.getItem(bestKey(l, m));
          return v ? modeName(m, l) + ' ' + v + '점' : null;
        }).filter(Boolean);
        return parts.length ? '🏆 ' + LEVEL_NAME[l] + ' · ' + parts.join(' · ') : null;
      }).filter(Boolean);
      $('best').innerHTML = lines.join('<br>');
    } catch (e) { $('best').textContent = ''; }
  }
  function saveBest() {
    try {
      const k = bestKey(state.level, state.mode), prev = +(localStorage.getItem(k) || 0);
      if (state.score > prev) localStorage.setItem(k, state.score);
    } catch (e) {}
  }

  /* 보기 만들기: 정답과 헷갈리는 오답 */
  function numChoices(ans, n, opts = {}) {
    const min = opts.min ?? 0, max = opts.max ?? Infinity, extra = opts.extra || [];
    const cands = [...extra, ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + 3, ans - 3, ans + 5, ans - 5, ans + 100, ans - 100];
    const set = new Set([ans]);
    for (const c of shuffle(cands.slice(0, extra.length)).concat(shuffle(cands.slice(extra.length)))) {
      if (set.size >= n) break;
      if (Number.isInteger(c) && c >= min && c <= max && c !== ans) set.add(c);
    }
    let guard = 0;
    while (set.size < n && guard++ < 50) { const c = ans + rng(-12, 12); if (c >= min && c <= max) set.add(c); }
    return shuffle([...set]);
  }
  const fmtClock = (h, m) => h + '시' + (m ? ' ' + m + '분' : '');

  /* 문제 만들기 -------------------------------------------------- */
  function makeQ() {
    const L = state.level, m = state.mode, r = state.round;
    const nC = Math.max(level === "five" ? 2 : 3, Math.min(5, (L === "easy" ? 3 : 4) + (EFF() >= 2 ? 1 : EFF() <= -2 ? -1 : 0)));
    if (m === "e") return wordProblem(L, nC);
    if (m === "f") return moneyQ(L, nC);
    if (L === "nine" && m === "d" && Math.random() < .5) return clockQ(nC);
    const q = { kind: 'expr', ans: 0, choices: null, input: false, stage: '', eq: '', ask: '', label: '' };

    if (L === 'easy') {
      if (m === 'a') {            // 10까지 더하기·빼기 (그림)
        const op = EFF() <= -2 ? "+" : (r < 4 && EFF() < 2) ? "+" : pick(["+", "-"]);
        const cap = Math.max(4, Math.min(20, (r < 3 ? 6 : 10) + EFF() * 2));
        let a, b;
        if (op === '+') { a = rng(1, cap - 1); b = rng(1, cap - a); q.ans = a + b; }
        else { a = rng(2, cap); b = rng(1, a - 1); q.ans = a - b; }
        const f = pick(FRUITS);
        const grp = (n, gone = 0) => `<div class="group">${Array.from({length: n}, (_, i) => `<i class="${i >= n - gone ? 'gone' : ''}" style="animation-delay:${i * 40}ms">${f}</i>`).join('')}</div>`;
        q.stage = op === '+' ? grp(a) + `<span class="opsign">+</span>` + grp(b) : grp(a, b);
        q.ask = op === '+' ? '모두 몇 개일까요?' : b + '개를 먹었어요. 몇 개 남았을까요?';
        q.eq = `<span>${a}</span><span class="sign">${op === '+' ? '+' : '−'}</span><span>${b}</span><span class="sign">=</span><span class="box" id="ansbox">?</span>`;
        q.label = `${a} ${op === '+' ? '+' : '−'} ${b}`;
        q.choices = numChoices(q.ans, nC, { min: 0, max: 20 });
      } else if (m === 'b') {     // 몇 개일까? (20까지 세기)
        const hi = Math.max(5, Math.min(30, 20 + EFF() * 3)), n = r < 3 ? rng(3, Math.min(9, hi)) : rng(Math.min(10, hi - 2), hi);
        const f = pick(FRUITS);
        q.ans = n;
        q.stage = `<div class="group ${n > 10 ? 'wide' : ''}">${Array.from({length: n}, (_, i) => `<i style="animation-delay:${i * 30}ms">${f}</i>`).join('')}</div>`;
        q.ask = '모두 몇 개인지 세어 보세요';
        q.eq = `<span class="box" id="ansbox">?</span><span style="font-size:.6em">개</span>`;
        q.label = f + ' ' + n + '개';
        q.choices = numChoices(n, nC, { min: 1, max: 30 });
      } else if (m === 'c') {     // 10 만들기
        const T = EFF() <= -2 ? 5 : EFF() >= 2 ? 20 : 10;
        const a = rng(1, T - 1); q.ans = T - a;
        q.stage = `<div class="tenframe">${Array.from({length: T}, (_, i) => `<i class="${i < a ? 'on' : 'q'}"></i>`).join('')}</div>`;
        q.ask = T + "을 만들려면 몇 개가 더 있어야 할까요?";
        q.eq = `<span>${a}</span><span class="sign">+</span><span class="box" id="ansbox">?</span><span class="sign">=</span><span>${T}</span>`;
        q.label = `${a} + ? = ${T}`;
        q.choices = numChoices(q.ans, nC, { min: 1, max: T - 1 });
      } else {                    // 빠진 수 (1~30)
        let seq;
        if (EFF() >= 2 && r % 2) { const s = rng(5, 30); seq = [0,1,2,3,4].map(i => s - i); }
        else if (EFF() >= 3 && r % 3 === 0) { const s = 2 * rng(1, 8); seq = [0,1,2,3,4].map(i => s + 2 * i); }
        else { const start = r < 4 ? rng(1, Math.max(2, 6 + EFF() * 2)) : rng(1, Math.max(6, 26 + EFF() * 4)); seq = [0,1,2,3,4].map(i => start + i); }
        const bi = rng(1, 4); q.ans = seq[bi];
        q.kind = 'seq';
        q.ask = seq[1] < seq[0] ? "거꾸로 세어요. 빈칸에 들어갈 수는?" : seq[1] - seq[0] === 2 ? "2씩 뛰어 세어요. 빈칸에 들어갈 수는?" : "순서대로 세어요. 빈칸에 들어갈 수는?";
        q.eq = seq.map((v, i) => i === bi ? `<span class="box" id="ansbox">?</span>` : `<span class="cell">${v}</span>`).join('');
        q.label = seq.map((v, i) => i === bi ? '?' : v).join(', ');
        q.choices = numChoices(q.ans, nC, { min: 1, max: 40 });
      }
    } else if (L === 'hard') {
      if (m === 'a') {            // 20까지, 받아올림·받아내림
        const op = pick(['+', '+', '-']);
        let a, b;
        if (op === '+') { a = rng(5, 9); b = rng(11 - a, 9); q.ans = a + b; }          // 합 11~18
        else { a = rng(11, 18); b = rng(a - 9, 9); q.ans = a - b; }                     // 받아내림
        q.eq = `<span>${a}</span><span class="sign">${op === '+' ? '+' : '−'}</span><span>${b}</span><span class="sign">=</span><span class="box" id="ansbox">?</span>`;
        q.label = `${a} ${op === '+' ? '+' : '−'} ${b}`;
        q.ask = op === '+' ? '10을 먼저 만들어 더해 보세요' : '10에서 먼저 빼 보세요';
        q.choices = numChoices(q.ans, nC, { min: 0, max: 20, extra: [q.ans + (op === '+' ? -10 : 10)] });
      } else if (m === 'b') {     // 가르기·모으기
        const whole = rng(5, 10), part = rng(1, whole - 1);
        const split = Math.random() < .6;
        q.kind = 'bond';
        if (split) {
          q.ans = whole - part;
          q.stage = `<div class="bond"><div class="n top">${whole}</div><div class="n">${part}</div><div class="n q">?</div></div>`;
          q.ask = `${whole}은(는) ${part}와(과) 몇으로 가를 수 있을까요?`;
          q.label = `${whole} → ${part}, ?`;
        } else {
          q.ans = whole;
          q.stage = `<div class="bond"><div class="n top q">?</div><div class="n">${part}</div><div class="n">${whole - part}</div></div>`;
          q.ask = `${part}와(과) ${whole - part}을(를) 모으면 몇일까요?`;
          q.label = `${part}, ${whole - part} → ?`;
        }
        q.eq = '';
        q.choices = numChoices(q.ans, nC, { min: 1, max: 10 });
      } else if (m === 'c') {     // 세 수 계산 (20 이하)
        let a, b, c, ops;
        const t = rnd(3);
        if (t === 0) { a = rng(2, 9); b = rng(1, 9); c = rng(1, 20 - a - b > 0 ? Math.min(9, 20 - a - b) : 1); ops = ['+', '+']; q.ans = a + b + c; }
        else if (t === 1) { a = rng(10, 20); b = rng(1, 9); c = rng(1, a - b); ops = ['-', '-']; q.ans = a - b - c; }
        else { a = rng(3, 12); b = rng(1, 8); c = rng(1, Math.min(9, a + b)); ops = ['+', '-']; q.ans = a + b - c; }
        const sg = o => o === '+' ? '+' : '−';
        q.eq = `<span>${a}</span><span class="sign">${sg(ops[0])}</span><span>${b}</span><span class="sign">${sg(ops[1])}</span><span>${c}</span><span class="sign">=</span><span class="box" id="ansbox">?</span>`;
        q.label = `${a} ${sg(ops[0])} ${b} ${sg(ops[1])} ${c}`;
        q.ask = '앞에서부터 차례로 계산해요';
        q.choices = numChoices(q.ans, nC, { min: 0, max: 30 });
      } else {                    // 뛰어 세기
        const step = pick([2, 5, 10, 2, 5]);
        const maxStart = 100 - step * 4;
        const start = step === 10 ? pick([10, 20, 30, 40, 50, 60]) : step === 5 ? 5 * rng(1, Math.floor(maxStart / 5)) : 2 * rng(1, Math.floor(maxStart / 2));
        const seq = [0,1,2,3,4].map(i => start + step * i);
        const bi = rng(1, 4); q.ans = seq[bi];
        q.kind = 'seq';
        q.ask = `${step}씩 뛰어 세어요. 빈칸에 들어갈 수는?`;
        q.eq = seq.map((v, i) => i === bi ? `<span class="box" id="ansbox">?</span>` : `<span class="cell">${v}</span>`).join('');
        q.label = seq.map((v, i) => i === bi ? '?' : v).join(', ');
        q.choices = numChoices(q.ans, nC, { min: 1, max: 100, extra: [q.ans + step, q.ans - step, q.ans + 1] });
      }
    } else if (L === 'pro') {
      if (m === 'a') {            // 두 자리 세로셈
        const op = pick(['+', '-']);
        let a, b;
        if (op === '+') { do { a = rng(12, 78); b = rng(11, 99 - a); } while (a % 10 + b % 10 < 10 && Math.random() < .7); q.ans = a + b; }
        else { do { a = rng(30, 99); b = rng(11, a - 1); } while (a % 10 >= b % 10 && Math.random() < .7); q.ans = a - b; }
        q.kind = 'column'; q.input = true;
        q.stage = `<div class="column"><div class="row"><span>${a}</span></div><div class="row op"><span>${op === '+' ? '+' : '−'}</span><span>${b}</span></div><div class="row ans" id="colans">&nbsp;</div></div>`;
        q.eq = '';
        q.label = `${a} ${op === '+' ? '+' : '−'} ${b}`;
        q.ask = '일의 자리부터 계산하고 숫자를 눌러 답을 써요';
      } else if (m === 'b') {     // 세 수 섞어 계산 (50 이하)
        let a, b, c, ops;
        const t = rnd(3);
        if (t === 0) { a = rng(11, 30); b = rng(5, 19); c = rng(2, 15); ops = ['+', '-']; q.ans = a + b - c; }
        else if (t === 1) { a = rng(20, 50); b = rng(5, 19); c = rng(3, 19); ops = ['-', '+']; q.ans = a - b + c; }
        else { a = rng(30, 50); b = rng(5, 15); c = rng(3, a - b - 1); ops = ['-', '-']; q.ans = a - b - c; }
        const sg = o => o === '+' ? '+' : '−';
        q.input = true;
        q.eq = `<span>${a}</span><span class="sign">${sg(ops[0])}</span><span>${b}</span><span class="sign">${sg(ops[1])}</span><span>${c}</span><span class="sign">=</span><span class="box" id="ansbox">&nbsp;</span>`;
        q.label = `${a} ${sg(ops[0])} ${b} ${sg(ops[1])} ${c}`;
        q.ask = '앞에서부터 차례로 계산하고 답을 눌러요';
      } else if (m === 'c') {     // 구구단 2~5단 (묶음 그림)
        const a = pick([2, 3, 4, 5]), b = rng(1, 9); q.ans = a * b;
        q.stage = b <= 6 ? `<div class="dots">${Array.from({length: b}, () => `<div class="g">${Array.from({length: a}, () => '<i></i>').join('')}</div>`).join('')}</div>` : '';
        q.eq = `<span>${a}</span><span class="sign">×</span><span>${b}</span><span class="sign">=</span><span class="box" id="ansbox">?</span>`;
        q.label = `${a} × ${b}`;
        q.ask = b <= 6 ? `${a}개씩 ${b}묶음이면 모두 몇 개?` : `${a}단을 외워 보세요`;
        q.choices = numChoices(q.ans, nC, { min: 1, max: 50, extra: [a * (b + 1), a * (b - 1), a + b] });
      } else {                    // 시계 읽기 (정각·30분)
        const h = rng(1, 12), mm = EFF() >= 2 ? pick([0, 15, 30, 45]) : EFF() <= -2 ? 0 : pick([0, 30, 0, 30]);
        q.kind = 'clock';
        q.stage = clockSVG(h, mm);
        q.ask = '시계가 가리키는 시각은?';
        q.eq = '';
        q.ansText = fmtClock(h, mm);
        q.label = q.ansText;
        const wrong = new Set();
        const alts = [[h % 12 + 1, mm], [(h + 10) % 12 + 1, mm], [h, mm ? 0 : 30], [h % 12 + 1, mm ? 0 : 30], [mm === 30 ? h % 12 + 1 : (h + 10) % 12 + 1, 30]];
        for (const [hh, m2] of shuffle(alts)) { if (wrong.size >= nC - 1) break; const t = fmtClock(hh, m2); if (t !== q.ansText) wrong.add(t); }
        q.choices = shuffle([q.ansText, ...wrong]);
      }
    } else {
      if (m === 'a') {            // 세 자리 세로셈
        const op = pick(['+', '-']);
        let a, b;
        if (op === '+') { a = rng(125, 780); b = rng(115, 999 - a); q.ans = a + b; }
        else { a = rng(300, 999); b = rng(105, a - 1); q.ans = a - b; }
        q.kind = 'column'; q.input = true;
        q.stage = `<div class="column"><div class="row"><span>${a}</span></div><div class="row op"><span>${op === '+' ? '+' : '−'}</span><span>${b}</span></div><div class="row ans" id="colans">&nbsp;</div></div>`;
        q.eq = '';
        q.label = `${a} ${op === '+' ? '+' : '−'} ${b}`;
        q.ask = '받아올림·받아내림을 잊지 말고 계산해요';
      } else if (m === 'b') {     // 구구단 2~9단 + 빈칸
        const a = rng(2, 9), b = rng(2, 9);
        q.input = true;
        const t = rnd(3);
        if (t === 0) { q.ans = a * b; q.eq = `<span>${a}</span><span class="sign">×</span><span>${b}</span><span class="sign">=</span><span class="box" id="ansbox">&nbsp;</span>`; q.label = `${a} × ${b}`; q.ask = `${a}단을 떠올려 보세요`; }
        else if (t === 1) { q.ans = b; q.eq = `<span>${a}</span><span class="sign">×</span><span class="box" id="ansbox">&nbsp;</span><span class="sign">=</span><span>${a * b}</span>`; q.label = `${a} × ? = ${a * b}`; q.ask = `${a}에 얼마를 곱하면 ${a * b}이 될까요?`; }
        else { q.ans = a; q.eq = `<span class="box" id="ansbox">&nbsp;</span><span class="sign">×</span><span>${b}</span><span class="sign">=</span><span>${a * b}</span>`; q.label = `? × ${b} = ${a * b}`; q.ask = `얼마에 ${b}을(를) 곱하면 ${a * b}이 될까요?`; }
      } else if (m === 'c') {     // 나눗셈
        const d = rng(2, 9), qq = rng(2, 9); q.ans = qq;
        q.input = true;
        q.eq = `<span>${d * qq}</span><span class="sign">÷</span><span>${d}</span><span class="sign">=</span><span class="box" id="ansbox">&nbsp;</span>`;
        q.label = `${d * qq} ÷ ${d}`;
        q.ask = `${d}단에서 ${d * qq}이 나오는 곳을 찾아요`;
      } else {                    // 수의 규칙
        const t = rnd(5);
        let seq, rule;
        if (t === 0) { const s = rng(2, 9), st = rng(1, 9); seq = [0,1,2,3,4].map(i => s + st * i); rule = `${st}씩 커져요`; }
        else if (t === 1) { const s = rng(40, 99), st = rng(2, 9); seq = [0,1,2,3,4].map(i => s - st * i); rule = `${st}씩 작아져요`; }
        else if (t === 2) { const s = rng(1, 3); seq = [0,1,2,3,4].map(i => s * 2 ** i); rule = '2배씩 커져요'; }
        else if (t === 3) { const s = rng(1, 5); seq = [s, s + 1, s + 3, s + 6, s + 10]; rule = '1, 2, 3, 4씩 더 커져요'; }
        else { const k = rng(3, 9); seq = [0,1,2,3,4].map(i => k * (i + 1)); rule = `${k}단이에요`; }
        const bi = pick([3, 4, 4]); q.ans = seq[bi];
        q.kind = 'seq';
        q.ask = '규칙을 찾아 빈칸을 채워요';
        q.eq = seq.map((v, i) => i === bi ? `<span class="box" id="ansbox">?</span>` : `<span class="cell">${v}</span>`).join('');
        q.label = seq.map((v, i) => i === bi ? '?' : v).join(', ');
        q.rule = rule;
        const step = seq[1] - seq[0];
        q.choices = numChoices(q.ans, nC, { min: 0, max: 999, extra: [q.ans + step, q.ans - step, seq[bi - 1] * 2] });
      }
    }
    return q;
  }

  /* ───── 문장제·돈 세기 (모드 e, f) ───── */
  const NAMES = ['지우','하늘','민준','서연','도윤','유나','하준','수아'];
  const ITEMS = [['사탕','🍬'],['사과','🍎'],['딸기','🍓'],['구슬','🔮'],['스티커','⭐'],['풍선','🎈'],['쿠키','🍪'],['연필','✏️'],['블록','🧱'],['조개','🐚']];
  const hasJong = s => { const c = s.codePointAt(s.length - 1) - 0xAC00; return c >= 0 && c < 11172 && c % 28 > 0; };
  const josa = (w, a, b) => w + (hasJong(w) ? a : b);           // josa(w,'이','가') josa(w,'을','를') josa(w,'은','는')
  const emojiRow = (e, n) => n > 0 && n <= 12 ? `<div class="group">${Array.from({length: n}, () => `<i>${e}</i>`).join('')}</div>` : '';

  function wordProblem(L, nC) {
    const q = { kind: 'story', ans: 0, choices: null, input: L === 'pro' || L === 'nine', stage: '', eq: '', ask: '문제를 읽고 답을 구해요', label: '' };
    const nm = pick(NAMES), [it, ie] = pick(ITEMS);
    const N = josa(nm, '이', '가'), T = josa(it, '을', '를');
    let text = '', hint = '', unit = '개';
    const t = rnd(4);
    if (L === 'easy') {
      if (t < 2 || EFF() <= -2) { const a = rng(1, 6), b = rng(1, 9 - a); q.ans = a + b; text = `${N} ${it} ${a}개를 가지고 있었어요. ${b}개를 더 받았어요. ${it}은 모두 몇 개일까요?`; hint = emojiRow(ie, a) + `<span class="opsign">+</span>` + emojiRow(ie, b); q.label = `${a} + ${b}`; }
      else { const a = rng(3, 10), b = rng(1, a - 1); q.ans = a - b; text = `${it} ${a}개 중에서 ${b}개를 먹었어요. 남은 ${it}은 몇 개일까요?`; hint = emojiRow(ie, a); q.label = `${a} − ${b}`; }
    } else if (L === 'hard') {
      if (t === 0) { const a = rng(5, 9), b = rng(11 - a, 9); q.ans = a + b; text = `버스에 ${a}명이 타고 있었어요. 다음 정류장에서 ${b}명이 더 탔어요. 버스에는 모두 몇 명이 있을까요?`; unit = '명'; q.label = `${a} + ${b}`; }
      else if (t === 1) { const a = rng(11, 18), b = rng(a - 9, 9); q.ans = a - b; text = `${N} ${it} ${a}개를 가지고 있어요. 동생에게 ${b}개를 주면 몇 개가 남을까요?`; q.label = `${a} − ${b}`; }
      else if (t === 2) { const b = rng(8, 15), a = rng(2, b - 2); q.ans = b - a; text = `${it} ${a}개가 있어요. ${b}개가 되려면 몇 개가 더 있어야 할까요?`; q.label = `${a} + ? = ${b}`; }
      else { const a = rng(6, 12), b = rng(3, 9); q.ans = Math.abs(a - b); const nm2 = pick(NAMES.filter(x => x !== nm)); text = `${nm}는 ${it} ${a}개, ${nm2}는 ${b}개를 가지고 있어요. 누가 몇 개 더 많을까요?`; q.ask = '더 많은 사람의 개수 차이를 구해요'; q.label = `${a} − ${b}`; }
    } else if (L === 'pro') {
      if (t === 0) { const a = rng(15, 60), b = rng(12, 39); q.ans = a + b; text = `문구점에서 ${it} ${a}개를 팔았어요. 오후에 ${b}개를 더 팔았어요. 오늘 판 ${it}은 모두 몇 개일까요?`; q.label = `${a} + ${b}`; }
      else if (t === 1) { const a = rng(40, 95), b = rng(12, a - 10); q.ans = a - b; text = `${N} 줄넘기를 ${a}번 넘었고, 동생은 ${b}번 넘었어요. ${nm}는 동생보다 몇 번 더 넘었을까요?`; unit = '번'; q.label = `${a} − ${b}`; }
      else if (t === 2) { const a = pick([2,3,4,5]), b = rng(2, 9); q.ans = a * b; text = `한 봉지에 ${it}이 ${a}개씩 들어 있어요. ${b}봉지에는 ${it}이 모두 몇 개 있을까요?`; q.label = `${a} × ${b}`; }
      else { const a = rng(2, 5), b = rng(2, 6), c = rng(3, 15); q.ans = a * b + c; text = `${it}을 ${a}개씩 ${b}줄로 놓고, ${c}개를 더 놓았어요. ${it}은 모두 몇 개일까요?`; q.label = `${a} × ${b} + ${c}`; }
    } else {
      if (t === 0) { const a = rng(120, 480), b = rng(105, 400); q.ans = a + b; text = `도서관에 동화책이 ${a}권, 그림책이 ${b}권 있어요. 책은 모두 몇 권일까요?`; unit = '권'; q.label = `${a} + ${b}`; }
      else if (t === 1) { const a = rng(300, 900), b = rng(105, a - 50); q.ans = a - b; text = `${N} ${a}원을 가지고 ${b}원짜리 ${it}을 샀어요. 남은 돈은 얼마일까요?`; unit = '원'; q.label = `${a} − ${b}`; }
      else if (t === 2) { const d = rng(2, 9), k = rng(2, 9); q.ans = k; text = `${it} ${d * k}개를 ${d}명이 똑같이 나누어 가지려고 해요. 한 명이 몇 개씩 가질 수 있을까요?`; q.label = `${d * k} ÷ ${d}`; }
      else { const a = rng(20, 60), b = rng(10, 30), c = rng(5, 25); q.ans = a + b - c; text = `${N} ${it} ${a}개를 가지고 있었어요. ${b}개를 더 사고 친구에게 ${c}개를 주었어요. 지금 ${it}은 몇 개일까요?`; q.label = `${a} + ${b} − ${c}`; }
    }
    q.stage = `<div class="story">${text}</div>` + (hint && EFF() < 2 ? `<div class="stage-hint">${hint}</div>` : "");
    q.eq = `<span class="box" id="ansbox">${q.input ? '&nbsp;' : '?'}</span><span style="font-size:.6em">${unit}</span>`;
    q.unit = unit;
    if (!q.input) q.choices = numChoices(q.ans, nC, { min: 0, max: 40 });
    return q;
  }

  const COIN = (v) => `<span class="coin c${v}">${v}</span>`;
  const BILL = () => `<span class="bill">1000</span>`;
  function moneyQ(L, nC) {
    const q = { kind: 'money', ans: 0, choices: null, input: L === 'pro' || L === 'nine', stage: '', eq: '', ask: '모두 얼마일까요?', label: '' };
    let counts;
    if (L === "easy") counts = EFF() <= -2 ? { 100: rng(1, 5) } : EFF() >= 2 ? { 100: rng(0, 5), 50: rng(0, 1), 10: rng(0, 5) } : { 100: rng(1, 5), 10: rng(0, 5) };
    else if (L === 'hard') counts = { 100: rng(0, 6), 50: rng(0, 1), 10: rng(0, 4) };
    else if (L === 'pro') counts = { 500: rng(0, 2), 100: rng(0, 4), 50: rng(0, 1), 10: rng(0, 4) };
    else counts = { 1000: rng(0, 2), 500: rng(0, 1), 100: rng(0, 4), 50: rng(0, 1), 10: rng(0, 4) };
    let total = 0; const parts = [];
    for (const v of [1000, 500, 100, 50, 10]) { const n = counts[v] || 0; total += v * n; for (let i = 0; i < n; i++) parts.push(v === 1000 ? BILL() : COIN(v)); }
    if (total === 0) { counts[100] = 1; total = 100; parts.push(COIN(100)); }
    if (L === 'nine' && Math.random() < .5) {
      // 거스름돈
      const pay = pick([1000, 1000, 500]);
      const price = pay === 1000 ? 10 * rng(15, 95) : 10 * rng(12, 45);
      q.ans = pay - price;
      const [it] = pick(ITEMS);
      q.stage = `<div class="story">${price}원짜리 ${it}을 사고 ${pay}원을 냈어요. 거스름돈은 얼마일까요?</div><div class="stage-hint">${pay === 1000 ? BILL() : COIN(500)}</div>`;
      q.ask = '거스름돈을 구해요'; q.label = `${pay} − ${price}`;
    } else {
      q.ans = total;
      q.stage = `<div class="money">${parts.join('')}</div>`;
      q.label = Object.entries(counts).filter(([, n]) => n).map(([v, n]) => v + '원×' + n).join(' ');
    }
    q.eq = `<span class="box" id="ansbox">${q.input ? '&nbsp;' : '?'}</span><span style="font-size:.6em">원</span>`;
    q.unit = '원';
    if (!q.input) q.choices = numChoices(q.ans, nC, { min: 0, max: 5000, extra: [q.ans + 10, q.ans - 10, q.ans + 100, q.ans - 100, q.ans + 50] });
    return q;
  }

  /* 9살: 5분 단위 시계 */
  function clockQ(nC) {
    const h = rng(1, 12), mm = 5 * rng(0, 11);
    const q = { kind: 'clock', ans: 0, choices: null, input: false, stage: clockSVG(h, mm), eq: '', ask: '시계가 가리키는 시각은? (5분 단위)', label: '' };
    q.ansText = fmtClock(h, mm); q.label = q.ansText;
    const alts = [[h % 12 + 1, mm], [h, (mm + 5) % 60], [h, (mm + 55) % 60], [(mm / 5) || 12, (h * 5) % 60], [h, (mm + 30) % 60], [(h + 10) % 12 + 1, mm]];
    const wrong = new Set();
    for (const [hh, m2] of shuffle(alts)) { if (wrong.size >= nC - 1) break; const t = fmtClock(hh, m2); if (t !== q.ansText) wrong.add(t); }
    q.choices = shuffle([q.ansText, ...wrong]);
    return q;
  }

  function clockSVG(h, m) {
    const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
    const nums = Array.from({length: 12}, (_, i) => { const a = (i + 1) * 30 * Math.PI / 180; return `<text x="${100 + 72 * Math.sin(a)}" y="${100 - 72 * Math.cos(a) + 7}" text-anchor="middle" font-size="20" font-family="Jua, sans-serif" fill="#5B2A4E">${i + 1}</text>`; }).join('');
    const ticks = Array.from({length: 60}, (_, i) => { const a = i * 6 * Math.PI / 180, l = i % 5 ? 4 : 8; return `<line x1="${100 + 90 * Math.sin(a)}" y1="${100 - 90 * Math.cos(a)}" x2="${100 + (90 - l) * Math.sin(a)}" y2="${100 - (90 - l) * Math.cos(a)}" stroke="#FFB3D1" stroke-width="${i % 5 ? 1.5 : 3}"/>`; }).join('');
    return `<svg class="clock" viewBox="0 0 200 200" aria-label="시계">
      <circle cx="100" cy="100" r="96" fill="#FFF3F8" stroke="#FF5FA2" stroke-width="6"/>${ticks}${nums}
      <line x1="100" y1="100" x2="${100 + 46 * Math.sin(ha * Math.PI / 180)}" y2="${100 - 46 * Math.cos(ha * Math.PI / 180)}" stroke="#5B2A4E" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="100" x2="${100 + 68 * Math.sin(ma * Math.PI / 180)}" y2="${100 - 68 * Math.cos(ma * Math.PI / 180)}" stroke="#FF5FA2" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="6" fill="#5B2A4E"/></svg>`;
  }

  /* 화면 ------------------------------------------------------ */
  function renderStars() {
    $('stars').innerHTML = Array.from({length: TOTAL}, (_, i) => {
      const r = state.review[i];
      return `<span class="${r === true ? 'on' : r === false ? 'miss' : ''}">${r === false ? '💔' : '⭐'}</span>`;
    }).join('');
  }
  function renderQ() {
    const q = state.q;
    $('round').textContent = (state.round + 1) + ' / ' + TOTAL;
    $("tag").textContent = LEVEL_NAME[state.age || state.level] + DIFF_TXT() + ' · ' + modeName(state.mode, state.level);
    renderStars();
    $('ask').textContent = q.ask;
    $('stage').innerHTML = q.stage;
    $('eq').className = 'eq' + (q.kind === 'seq' ? ' seq' : '') + (q.kind === 'column' ? ' small' : '');
    $('eq').innerHTML = q.eq;
    $('eq').hidden = !q.eq;
    if (q.input) {
      $('choices').hidden = true; $('pad').hidden = false;
      state.typed = ''; showTyped();
    } else {
      $('pad').hidden = true; $('choices').hidden = false;
      $("choices").className = "choices" + (q.choices.length === 4 ? " four" : q.choices.length === 5 ? " five" : "");
      $('choices').innerHTML = q.choices.map((c, i) => `<button class="btn choice ${String(c).length >= 5 ? 'long' : ''}" id="choice-${i}" data-v="${c}">${c}</button>`).join('');
    }
    $('feedback').textContent = ''; $('feedback').className = 'feedback';
    state.locked = false; state.tries = 0;
  }
  function showTyped() {
    const t = state.typed || '';
    const box = $('ansbox'); if (box) box.innerHTML = t || '&nbsp;';
    const col = $('colans'); if (col) col.innerHTML = t || '&nbsp;';
  }

  function judge(v) {
    if (state.locked) return;
    const q = state.q, box = $('ansbox');
    const ok = q.ansText != null ? v === q.ansText : +v === q.ans;
    if (ok) {
      state.locked = true;
      const first = state.tries === 0;
      state.review[state.round] = first;
      if (first) state.score++;
      if (box) { box.innerHTML = v; box.classList.add('ok'); }
      const col = $('colans'); if (col) col.textContent = v;
      $('feedback').textContent = (first ? pick(PRAISE) : '이번엔 맞았어요!') + (q.rule ? ' (' + q.rule + ')' : '') + ' 🌟';
      $('feedback').className = 'feedback good';
      document.querySelectorAll('.choice').forEach(b => { b.disabled = true; if (b.dataset.v === String(v)) b.classList.add('right'); });
      renderStars(); sndGood(); if (first) confetti(40);
      setTimeout(next, 1300);
    } else {
      state.tries++;
      sndBad();
      const shakeEl = box || $('colans');
      if (shakeEl) { shakeEl.classList.remove('no'); void shakeEl.offsetWidth; shakeEl.classList.add('no'); }
      document.querySelectorAll('.choice').forEach(b => { if (b.dataset.v === String(v)) { b.classList.add('wrong'); b.disabled = true; } });
      if (state.tries >= (EFF() <= -1 ? 3 : EFF() >= 2 ? 1 : 2)) {
        // 두 번 틀리면 정답을 보여 주고 넘어가요
        state.locked = true;
        state.review[state.round] = false;
        const a = q.ansText != null ? q.ansText : q.ans;
        if (box) { box.innerHTML = a; box.classList.remove('no'); box.classList.add('reveal'); }
        const col = $('colans'); if (col) col.textContent = a;
        document.querySelectorAll('.choice').forEach(b => { b.disabled = true; if (b.dataset.v === String(a)) b.classList.add('right'); });
        $('feedback').textContent = '정답은 ' + a + '이에요. 다음에 또 해 봐요!';
        $('feedback').className = 'feedback';
        renderStars();
        setTimeout(next, 2000);
      } else {
        $('feedback').textContent = '다시 한번 생각해 볼까요? 🍀';
        $('feedback').className = 'feedback';
        if (q.input) { state.typed = ''; showTyped(); }
      }
    }
  }

  function next() {
    const q = state.q;
    state.reviewLabels[state.round] = { label: q.label, ans: q.ansText != null ? q.ansText : q.ans, ok: state.review[state.round] };
    state.round++;
    if (state.round >= TOTAL) return finish();
    state.q = makeQ(); renderQ();
  }
  function start(mode) {
    state = { mode, level: level === "five" ? "easy" : level, age: level, round: 0, score: 0, q: null, locked: false, tries: 0, typed: '', startedAt: Date.now(), review: [], reviewLabels: [] };
    state.q = makeQ();
    show('game'); renderQ();
  }
  function finish() {
    saveBest();
    const s = state.score, L = state.level;
    const secs = Math.round((Date.now() - state.startedAt) / 1000);
    $('result-score').textContent = '⭐ ' + s + ' / ' + TOTAL;
    $('result-time').textContent = '⏱ 걸린 시간 ' + Math.floor(secs / 60) + '분 ' + (secs % 60) + '초';
    if (s === TOTAL) {
      $('result-emoji').textContent = '🦄'; $('result-title').textContent = '완벽해요! 수학 박사님!';
      $('result-msg').textContent = L === 'easy' ? '이제 7살 놀이에 도전해 볼까요?' : L === 'hard' ? '이제 8살 놀이에 도전해 볼까요?' : L === 'pro' ? '이제 9살 놀이에 도전해 볼까요?' : '한 번에 다 맞혔어요. 수학 왕이에요!';
    }
    else if (s >= 7) { $('result-emoji').textContent = '🌈'; $('result-title').textContent = '정말 잘했어요!'; $('result-msg').textContent = '틀린 문제를 다시 한번 풀어 보면 더 좋아요.'; }
    else { $('result-emoji').textContent = '🌸'; $('result-title').textContent = '열심히 했어요!'; $('result-msg').textContent = '천천히 다시 해 보면 별을 더 모을 수 있어요.'; }
    const missed = state.reviewLabels.filter(x => x.ok === false);
    $('review').innerHTML = missed.length ? '<span style="background:none;border:0;font-family:var(--body);color:var(--plum-soft)">다시 볼 문제</span>' + missed.map(x => `<span>${x.label} = ${x.ans}</span>`).join('') : '';
    show('result'); sndWin(); confetti(s === TOTAL ? 160 : 80);
  }

  function show(id) {
    ["home","game","result","prestart"].forEach(x => $(x).hidden = x !== id);
    if (window.rpFit) window.rpFit();   // 화면이 바뀔 때만 한 화면 맞춤
    if (id === "home") loadBest();
    if (id === "result") reportMission();
  }
  function setLevel(l) {
    level = l;
    document.querySelectorAll('.level button').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === l ? 'true' : 'false'));
    $('level-note').textContent = LEVEL_NOTE[l];
    renderDiff();
    for (const m of ["a","b","c","d","e","f"]) {
      const [ico, title, small] = MODE_LABEL[l][m];
      $('ico-' + m).textContent = ico;
      $('label-' + m).innerHTML = title + '<small>' + small + '</small>';
    }
    try { localStorage.setItem('rainbow-math-level', l); } catch (e) {}
  }

  document.querySelectorAll('.level button').forEach(b => b.addEventListener('click', () => setLevel(b.dataset.level)));
  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => openPrestart(b.dataset.mode)));
  $('choices').addEventListener('click', e => { const b = e.target.closest('.choice'); if (b && !b.disabled) judge(b.dataset.v); });
  $('pad').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || state.locked) return;
    const k = b.dataset.k;
    if (k === 'del') state.typed = state.typed.slice(0, -1);
    else if (k === 'ok') { if (state.typed !== '') judge(state.typed); return; }
    else if (state.typed.length < 4) state.typed += k;
    sndTap(); showTyped();
  });
  addEventListener('keydown', e => {
    if ($('game').hidden || $('pad').hidden || state.locked) return;
    if (/^[0-9]$/.test(e.key) && state.typed.length < 4) { state.typed += e.key; showTyped(); }
    else if (e.key === 'Backspace') { state.typed = state.typed.slice(0, -1); showTyped(); }
    else if (e.key === 'Enter' && state.typed !== '') judge(state.typed);
  });
  $('again').addEventListener('click', () => start(state.mode));
  $("home-btn").addEventListener("click", () => { location.href = "index.html"; });
  $("quit").addEventListener("click", () => { location.href = "index.html"; });

  /* 놀이터(index.html) 미션 연동 */
  let missionId = null;
  function reportMission() {
    const missionId = GAME_KEY + ":" + state.level + ":" + state.mode;   // 오늘 한 놀이로 기록
    try {
      const key = "rp-results", all = JSON.parse(localStorage.getItem(key) || "{}");
      const d = new Date(), day = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      all[day] = all[day] || {};
      all[day][missionId] = Math.max(all[day][missionId] || 0, Math.round(state.score * 10 / TOTAL));
      localStorage.setItem(key, JSON.stringify(all));
      // 뽑기 에너지용 기록: 놀이를 마칠 때마다 한 줄씩
      const lg = JSON.parse(localStorage.getItem("rp-log") || "[]"); lg.push({ t: Date.now(), id: missionId, score: Math.round(state.score * 10 / TOTAL) }); if (lg.length > 500) lg.splice(0, lg.length - 500); localStorage.setItem("rp-log", JSON.stringify(lg));
    } catch (e) {}
    $("to-hub").hidden = true; $("home-btn").hidden = false;
    try { const av = JSON.parse(localStorage.getItem("rp-profile") || "{}").avatar; if (av) $("result-emoji").textContent = av; } catch (e) {}   // 결과 화면엔 내 친구(현재 캐릭터)
  }
  function launchFromUrl() {
    const p = new URLSearchParams(location.search);
    const l = p.get("level"), m = p.get("mode");
    if (!m || !LEVEL_NAME[l] || !MODE_LABEL[l] || !MODE_LABEL[l][m]) return false;
    missionId = GAME_KEY + ":" + l + ":" + m;
    const n = +p.get("n"); if (n === 5 || n === 10) TOTAL = n;
    setLevel(l); openPrestart(m); return true;
  }
  function renderDiff() {
    document.querySelectorAll("#diffrow button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.diff === DIFF ? "true" : "false"));
  }
  document.querySelectorAll("#diffrow button").forEach(b => b.addEventListener("click", () => { DIFF = +b.dataset.diff; try { localStorage.setItem(diffKey(pendingMode || (state && state.mode) || "x"), DIFF); } catch (e) {} renderDiff(); }));
  $("ps-start").addEventListener("click", () => { if (pendingMode) start(pendingMode); });
  function boot(data) {
    let saved = 'hard';
    try { saved = localStorage.getItem('rainbow-math-level') || 'hard'; } catch (e) {}
    if (!LEVEL_NAME[saved]) saved = 'hard';
    saved = "easy";   // 지금은 6살 놀이만 보여 줘요 (5·7·8·9살 내용은 숨김)
    setLevel(saved);
    if (launchFromUrl()) return;
    if (data && data.state && data.state.q && data.screen === 'game' && LEVEL_NAME[data.state.level]) {
      state = data.state; level = state.level; setLevel(level); show('game'); renderQ();
    } else show('home');
  }
  if (window.claude?.hot?.snapshot) {
    window.claude.hot.snapshot(() => ({ state, screen: $('game').hidden ? ($('result').hidden ? 'home' : 'result') : 'game' }));
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
